/* =========================
   STATUS O‘ZGARTIRISH
========================= */

async function changeStatus(id, status) {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/homes?id=eq." + id,
      {

        method: "PATCH",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + accessToken,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"

        },

        body: JSON.stringify({

          status: status

        })

      }
    );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    const home =
      homes.find(h => h.id === id);

    if (home) {

      home.status = status;

    }

  } catch (error) {

    alert(
      "❌ Statusni o‘zgartirib bo‘lmadi."
    );

    console.error(error);

  }

}


/* =========================
   O‘CHIRISH
========================= */

async function deleteHome(id) {

  const confirmDelete =
    confirm(
      "Bu e’lonni o‘chirishga ishonchingiz komilmi?"
    );


  if (!confirmDelete) return;


  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/homes?id=eq." + id,
      {

        method: "DELETE",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + accessToken

        }

      }
    );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    homes =
      homes.filter(
        home => home.id !== id
      );


    showHomes(homes);


  } catch (error) {

    alert(
      "❌ E’lonni o‘chirib bo‘lmadi."
    );

    console.error(error);

  }

}

  accessToken = "";

  document
    .getElementById("adminPanel")
    .classList.add("hidden");


  document
    .getElementById("loginBox")
    .classList.remove("hidden");


  document
    .getElementById("password")
    .value = "";

}


/* =========================
   XAVFSIZ MATN
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
