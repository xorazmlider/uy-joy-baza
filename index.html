<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xorazm Uy-Joy Baza</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    button {
      background: #1677ff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: .9;
    }

    .save {
      margin-top: 15px;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #eef5ff;
    }

    .home {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      background: #fafafa;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🏠 Xorazm Uy-Joy Baza</h1>

  <div class="card">

    <h2>Yangi uy qo‘shish</h2>

    <div class="form">

      <input id="title" placeholder="Uy nomi">

      <input id="city" placeholder="Shahar">

      <input id="area" placeholder="Hudud">

      <input id="rooms" type="number" placeholder="Xonalar">

      <input id="m2" type="number" step="0.01" placeholder="m²">

      <input id="price" type="number" step="0.01" placeholder="Narx">

      <input id="type" placeholder="Turi">

      <input id="finish" placeholder="Ta’miri">

    </div>

    <button class="save" onclick="addHome()">
      UYNI SAQLASH
    </button>

    <div id="status" class="status">
      Tayyor
    </div>

  </div>


  <div class="card">

    <h2>🏠 Uylar ro‘yxati</h2>

    <button onclick="loadHomes()">
      Yangilash
    </button>

    <div id="homes"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://rmelwwzaagyzedcrdpvkva.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_itMmxW5YPm87O6tADGIEYw_xrs2xNe-";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


function status(text) {
  document.getElementById("status").innerText = text;
}


async function addHome() {

  status("Saqlanmoqda...");

  const title = document.getElementById("title").value;
  const city = document.getElementById("city").value;
  const area = document.getElementById("area").value;

  const roomsValue =
    document.getElementById("rooms").value;

  const m2Value =
    document.getElementById("m2").value;

  const priceValue =
    document.getElementById("price").value;

  const type =
    document.getElementById("type").value;

  const finish =
    document.getElementById("finish").value;


  const { data, error } = await db
    .from("homes")
    .insert([
      {
        title: title,
        city: city,
        area: area,
        rooms: roomsValue ? Number(roomsValue) : null,
        m2: m2Value ? Number(m2Value) : null,
        price: priceValue ? Number(priceValue) : null,
        type: type,
        finish: finish
      }
    ])
    .select();


  if (error) {

    console.error(error);

    status(
      "XATO: " + error.message
    );

    return;
  }


  status("✅ Uy muvaffaqiyatli saqlandi!");

  document.getElementById("title").value = "";
  document.getElementById("city").value = "";
  document.getElementById("area").value = "";
  document.getElementById("rooms").value = "";
  document.getElementById("m2").value = "";
[16.08.2026 2:21] Alisher Xudayberganov: document.getElementById("price").value = "";
  document.getElementById("type").value = "";
  document.getElementById("finish").value = "";

  loadHomes();
}



async function loadHomes() {

  const homesDiv =
    document.getElementById("homes");

  homesDiv.innerHTML =
    "Yuklanmoqda...";


  const { data, error } = await db
    .from("homes")
    .select("*")
    .order("id", {
      ascending: false
    });


  if (error) {

    homesDiv.innerHTML =
      "XATO: " + error.message;

    console.error(error);

    return;
  }


  if (!data || data.length === 0) {

    homesDiv.innerHTML =
      "Hozircha uylar yo‘q.";

    return;
  }


  homesDiv.innerHTML =
    data.map(home => `

      <div class="home">

        <h3>
          ${home.title || "Nomsiz uy"}
        </h3>

        <div>
          📍 ${home.city || ""}
          ${home.area ? " — " + home.area : ""}
        </div>

        <div>
          🛏 Xonalar: ${home.rooms || ""}
        </div>

        <div>
          📐 Maydon: ${home.m2 || ""} m²
        </div>

        <div class="price">
          💰 ${home.price || ""}
        </div>

        <div>
          🏠 Turi: ${home.type || ""}
        </div>

        <div>
          🔨 Ta’miri: ${home.finish || ""}
        </div>

      </div>

    `).join("");
}


loadHomes();

</script>

</body>
</html>
