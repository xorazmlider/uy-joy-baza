<script>
const SUPABASE_URL='https://rmelwwzaagyzdcrdpkva.supabase.co';
const SUPABASE_KEY='sb_publishable_itMmxW5YPm87O6tADGIEYw_xrs2xNe-';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const KEY='xucrm_v2';
let db={homes:[],buyers:[],sellers:[],inquiries:[],tasks:[],deals:[],activities:[],documents:[],staff:[]};
let currentUser=null;
let currentStaff=null;

const ROLE_PAGES={
  Admin:['dashboard','homes','buyers','sellers','staff','matches','deals','tasks','reports','documents','contracts','sold'],
  Menejer:['dashboard','homes','buyers','sellers','matches','deals','tasks','reports','documents','contracts','sold'],
  Rieltor:['dashboard','homes','buyers','sellers','matches','deals','tasks','reports','documents','contracts','sold'],
  Agent:['dashboard','homes','buyers','sellers','matches','deals','tasks','reports','documents','contracts','sold']
};

function normalizeRole(role){
  const r=String(role||'').trim().toLowerCase();
  if(r==='admin')return 'Admin';
  if(r==='menejer'||r==='manager')return 'Menejer';
  if(r==='rieltor'||r==='realtor')return 'Rieltor';
  return 'Agent';
}
function currentRole(){return normalizeRole(currentStaff?.role||'');}
function canPage(page){return !!currentStaff && (ROLE_PAGES[currentRole()]||[]).includes(page);}

// ===== UY-LAR UCHUN ROL HUQUQLARI =====
// Admin: barcha uylar ustidan to'liq huquq.
// Menejer: barcha uylarni qo'shish/tahrirlash, lekin o'chirish yo'q.
// Rieltor: faqat o'zi kiritgan uylarni ko'rish/tahrirlash/sotilgan qilish, o'chirish yo'q.
// Agent: uylarni faqat ko'rish; qo'shish, tahrirlash va o'chirish yo'q.
function isRole(r){return currentRole()===r;}
function canAddHome(){return ['Admin','Menejer','Rieltor'].includes(currentRole());}
function canDeleteHome(){return currentRole()==='Admin';}
function canEditHome(h){
  if(!h)return false;
  if(currentRole()==='Admin'||currentRole()==='Menejer')return true;
  if(currentRole()==='Rieltor')return homeOwnedByCurrentStaff(h);
  return false;
}
function canChangeHomeStatus(h){
  if(!h)return false;
  return currentRole()==='Admin'||currentRole()==='Menejer'||(currentRole()==='Rieltor'&&homeOwnedByCurrentStaff(h));
}
function ownerMeta(h){return crmMeta(h?.note,'CRM_OWNER');}
function homeOwnedByCurrentStaff(h){
  if(!h||!currentStaff)return false;
  const m=ownerMeta(h);
  const sid=String(m.staff_id||'');
  const login=String(m.login||'').toLowerCase();
  const email=String(m.email||'').toLowerCase();
  return (sid && String(currentStaff.id)===sid) ||
         (login && String(currentStaff.login||'').toLowerCase()===login) ||
         (email && String(currentStaff.email||currentUser?.email||'').toLowerCase()===email);
}
function homesVisibleForCurrentUser(list){
  if(currentRole()==='Admin'||currentRole()==='Menejer'||currentRole()==='Agent')return list;
  if(currentRole()==='Rieltor')return list.filter(homeOwnedByCurrentStaff);
  return [];
}
function requireHomeAdd(){if(canAddHome())return true;alert("Sizning rolingizda uy qo'shish huquqi yo'q.");return false;}
function requireHomeEdit(h){if(canEditHome(h))return true;alert("Siz bu uyni tahrirlash huquqiga ega emassiz.");return false;}
function requireHomeDelete(){if(canDeleteHome())return true;alert("Uylarni faqat Admin o'chira oladi.");return false;}
function requireHomeStatus(h){if(canChangeHomeStatus(h))return true;alert("Bu uy statusini o'zgartirish huquqi sizda yo'q.");return false;}

function requirePage(page){
  if(canPage(page))return true;
  alert('Bu bo‘lim sizning rolingiz uchun yopiq.');
  return false;
}
async function loadCurrentStaff(){
  const {data:{user}}=await client.auth.getUser();
  currentUser=user||null;
  if(!user){currentStaff=null;return false;}
  const authEmail=String(user.email||'').trim().toLowerCase();
  let {data,error}=await client.from('staff').select('*').ilike('auth_email',authEmail).limit(1);
  if(error)throw error;
  if(!data?.length){
    const r=await client.from('staff').select('*').ilike('email',authEmail).limit(1);
    if(r.error)throw r.error;
    data=r.data||[];
  }
  if(data&&data.length){
    currentStaff=data[0];
    if(currentStaff.is_active===false){
      await client.auth.signOut();
      currentStaff=null;
      alert('Xodim akkaunti faol emas. Admin bilan bog‘laning.');
      return false;
    }
    return true;
  }
  const {data:allStaff,error:allErr}=await client.from('staff').select('id').limit(1);
  if(allErr)throw allErr;
  if(!allStaff?.length){
    currentStaff={id:'bootstrap-admin',name:user.user_metadata?.full_name||user.email,phone:'',email:user.email,auth_email:user.email,login:'admin',role:'Admin',is_active:true};
    return true;
  }
  currentStaff=null;
  await client.auth.signOut();
  throw new Error('Bu akkaunt Xodimlar bazasida ro‘yxatdan o‘tmagan. Admin bilan bog‘laning.');
}
function applyRoleUI(){
  document.querySelectorAll('.nav[data-page]').forEach(x=>{x.style.display=canPage(x.dataset.page)?'block':'none';});
  document.querySelectorAll('.mobile-nav [data-page]').forEach(x=>{x.style.display=canPage(x.dataset.page)?'block':'none';});
  const badge=document.getElementById('currentUserBadge');
  if(badge)badge.innerHTML=currentStaff?`👤 ${esc(currentStaff.name||currentUser?.email||'Xodim')}<br><span style="font-size:11px">${esc(currentRole())}</span>`:'';
}

const localDb=JSON.parse(localStorage.getItem(KEY)||'null');

async function loginCRM(event){
  event?.preventDefault();

  const loginValue=String(document.getElementById('loginLogin')?.value||'').trim().toLowerCase();
  const password=document.getElementById('loginPassword').value;
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('loginError');

  err.textContent='';
  if(!loginValue||!password){
    err.textContent='Login va parolni kiriting.';
    return;
  }

  btn.disabled=true;
  btn.textContent='Tekshirilmoqda...';

  try{
    let authEmail='';
    // Admin emaili o‘zgarishsiz. Xodim loginida @ yozish shart emas.
    if(loginValue.includes('@')){
      authEmail=loginValue;
    }else{
      authEmail=loginValue+'@crm.xorazmuylar.uz';
    }
    // Xodim Auth akkaunti create-staff tomonidan shu email bilan yaratiladi.
    // Shuning uchun login vaqtida staff SELECT/RLS ga bog‘lanmaymiz.
    // Masalan: test -> test@crm.xorazmuylar.uz
    // Masalan: anvar22 -> anvar22@crm.xorazmuylar.uz
    // Parol Supabase Auth orqali tekshiriladi.
    // Adminning haqiqiy email bilan kirishi saqlanadi.
    // Xodimning faol holati CRM ichida rolni yuklash bosqichida nazorat qilinadi.
    // LOGIN_NOT_FOUND bu yerda ishlatilmaydi.
    // AUTH_EMAIL_MISSING bu yerda ishlatilmaydi.
    // --------------------------------------------
    // Login emaili tayyor.

    const {data,error}=await client.auth.signInWithPassword({
      email:authEmail,
      password
    });

    if(error)throw error;
    if(!data?.session)throw new Error('SESSION_NOT_CREATED');

    await showCRM();

  }catch(e){
    console.error('CRM login:',e);

    if(e.message==='INACTIVE'){
      err.textContent='Bu xodim faol emas. Admin bilan bog‘laning.';
    }else if(e.message==='AUTH_EMAIL_MISSING'){
      err.textContent='Xodim akkaunti to‘liq sozlanmagan.';
    }else if(/invalid login credentials/i.test(String(e.message||''))){
      err.textContent='Login yoki parol noto‘g‘ri.';
    }else if(/email not confirmed/i.test(String(e.message||''))){
      err.textContent='Bu email Supabase’da tasdiqlanmagan.';
    }else if(/failed to fetch|network/i.test(String(e.message||''))){
      err.textContent='Internet yoki Supabase ulanishida xatolik.';
    }else{
      err.textContent='Kirishda xatolik: '+String(e.message||e);
    }
  }finally{
    btn.disabled=false;
    btn.textContent='Kirish';
  }
}

async function logoutCRM(){
  currentUser=null;currentStaff=null;
  const {error}=await client.auth.signOut();
  if(error){
    alert('Chiqishda xatolik: '+(error.message||error));
    return;
  }
  showLogin();
}

function showLogin(){
  document.getElementById('loginScreen').style.display='flex';
  document.querySelector('.app').style.display='none';
  document.querySelector('.mobile-nav').style.display='none';
}

async function showCRM(){
  try{
    const ok=await loadCurrentStaff();
    if(!ok){showLogin();return;}
  }catch(e){
    console.error(e);
    showLogin();
    const err=document.getElementById('loginError');
    if(err)err.textContent=e.message||'Xodim akkaunti topilmadi.';
    return;

async function loadDb(){
  const base=await Promise.all([
    client.from('homes').select('*').order('created_at',{ascending:false}),
    client.from('buyers').select('*').order('created_at',{ascending:false}),
    client.from('sellers').select('*').order('created_at',{ascending:false}),
    client.from('home_inquiries').select('*').order('created_at',{ascending:false})
  ]);
  const [h,b,s,i]=base;
  if(h.error) throw h.error;
  if(b.error) throw b.error;
  if(s.error) throw s.error;
  if(i.error) throw i.error;
  let staffData=[];
  if(currentRole()==='Admin'||currentRole()==='Menejer'){
    const st=await client.from('staff').select('*').order('created_at',{ascending:false});
    if(st.error) throw st.error;
    staffData=st.data||[];
  }

  const cloudEmpty=!h.data.length&&!b.data.length&&!s.data.length;
  const hasLocal=localDb && (localDb.homes?.length||localDb.buyers?.length||localDb.sellers?.length);

  if(cloudEmpty && hasLocal){
    const clean=(x)=>{const y={...x};delete y.id;delete y.created_at;return y};
    if(localDb.homes?.length) await client.from('homes').insert(localDb.homes.map(clean));
    if(localDb.buyers?.length){
      const migratedBuyers=localDb.buyers.map(x=>({...clean(x),owner_staff_id:currentStaff?.id||null}));
      await client.from('buyers').insert(migratedBuyers);
    }
    if(localDb.sellers?.length) await client.from('sellers').insert(localDb.sellers.map(clean));
    localStorage.removeItem(KEY);
    return loadDb();
  }

  db={homes:h.data||[],buyers:b.data||[],sellers:s.data||[],inquiries:i.data||[],tasks:[],deals:[],activities:[],documents:[],staff:staffData};

  // Professional modules are optional: if their tables are not created yet,
  // the main CRM still works normally.
  const extraTables=[
    ['tasks','crm_tasks'],
    ['deals','crm_deals'],
    ['activities','crm_activities'],
    ['documents','crm_documents']
  ];
  await Promise.all(extraTables.map(async ([key,table])=>{
    try{
      const r=await client.from(table).select('*').order('created_at',{ascending:false});
      if(!r.error) db[key]=r.data||[];
    }catch(e){}
  }));
  ['tasks','deals','activities','documents'].forEach(k=>{
    const local=proLocalGet(k);
    if(local.length) db[k]=[...db[k],...local.filter(l=>!db[k].some(x=>String(x.id)===String(l.id)))];
  });
}

  }
}

function parseMoneyInput(v){
  const s=String(v??'').trim().replace(/\s/g,'').replace(/,/g,'');
  if(!s)return 0;
  const usd=/\$|usd|dollar|доллар/i.test(s);
  const n=Number(s.replace(/[^0-9.\-]/g,''));
  if(!Number.isFinite(n))return NaN;
  return usd ? -Math.abs(n) : Math.abs(n);
}
function moneyCurrency(n){
  const v=Number(n);
  return v<0?'USD':'UZS';
}
function moneyAmount(n){
  return Math.abs(Number(n)||0);
}
function money(n){
  if(n===null||n===undefined||n===''||!Number.isFinite(Number(n))||Number(n)===0)return '—';
  const v=Number(n), a=Math.abs(v);
  if(v<0)return '$'+Math.round(a).toLocaleString('en-US');
  if(a>=1e9)return (a/1e9).toFixed(2)+' mlrd so‘m';
  return Math.round(a/1e6)+' mln so‘m';
}
function priceInputValue(n){
  if(n===null||n===undefined||n==='')return '';
  const v=Number(n);
  return v<0 ? '$'+Math.round(Math.abs(v)) : String(v);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function formatDateTime(v){
  if(!v)return 'Sana belgilanmagan';
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return String(v);
  return d.toLocaleString('uz-UZ',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function proLocalGet(key){
  try{return JSON.parse(localStorage.getItem('xucrm_pro_'+key)||'[]')}catch(e){return []}
}
function proLocalSet(key,val){localStorage.setItem('xucrm_pro_'+key,JSON.stringify(val))}
async function proInsert(table,key,row){
  const r=await client.from(table).insert(row).select().single();
  if(!r.error){
    db[key]=[r.data,...(db[key]||[])];
    return r.data;
  }
  const local={...row,id:'local_'+Date.now()+'_'+Math.random().toString(36).slice(2)};
  const arr=proLocalGet(key);arr.unshift(local);proLocalSet(key,arr);db[key]=[local,...(db[key]||[])];
  return local;
}
async function proUpdate(table,key,id,patch){
  if(String(id).startsWith('local_')){
    const arr=proLocalGet(key).map(x=>String(x.id)===String(id)?{...x,...patch}:x);
    proLocalSet(key,arr);db[key]=db[key].map(x=>String(x.id)===String(id)?{...x,...patch}:x);return;
  }
  const r=await client.from(table).update(patch).eq('id',id).select().single();
  if(r.error){alert('Saqlashda xatolik: '+r.error.message);return;}
  db[key]=db[key].map(x=>Number(x.id)===Number(id)?r.data:x);
}
async function proDelete(table,key,id){
  if(!confirm('O‘chirishni tasdiqlaysizmi?'))return;
  if(String(id).startsWith('local_')){
    const arr=proLocalGet(key).filter(x=>String(x.id)!==String(id));proLocalSet(key,arr);
  }else{
    const r=await client.from(table).delete().eq('id',id);
    if(r.error){alert('O‘chirishda xatolik: '+r.error.message);return;}
  }
  db[key]=db[key].filter(x=>String(x.id)!==String(id));render(key==='tasks'?'tasks':key==='deals'?'deals':key==='documents'?'homes':'buyers');
}

async function saveHomeInquiry(homeId){
  const name=val('inquiry_name'), phone=val('inquiry_phone');
  if(!name||!phone){alert('Mijoz ismi va telefonini kiriting.');return;}
  const h=db.homes.find(x=>Number(x.id)===Number(homeId));
  if(!h){alert('Uy topilmadi.');return;}
  const inquiryRow={
    home_id:homeId,
    name,
    phone,
    status:val('inquiry_status')||'Yangi',
    note:val('inquiry_note')
  };
  try{
    // 1) Uyning murojaatini saqlaymiz.
    const {data,error}=await client.from('home_inquiries').insert(inquiryRow).select().single();
    if(error)throw error;
    db.inquiries.unshift(data);

    // 2) Shu mijozni umumiy Xaridorlar bazasiga ham avtomatik qo‘shamiz.
    // Mijoz faqat ism/telefon/izoh bilan kiritilgani uchun uning talabi
    // murojaat qilgan uy parametrlaridan boshlanadi. Keyin Xaridorlar bo‘limida tahrirlash mumkin.
    const {data:existing,error:findError}=await client.from('buyers').select('*').eq('phone',phone).limit(1);
    if(findError)throw findError;

    if(existing && existing.length){
      const b=existing[0];
      const buyerUpdate={
        name,
        phone,
        city:h.city||b.city||'',
        area:h.area||b.area||'',
        rooms:Number(h.rooms)||Number(b.rooms)||0,
        m2:Number(h.m2)||Number(b.m2)||0,
        budget:Number(h.price)||Number(b.budget)||0,
        finish:h.finish||b.finish||'',
        type:b.type||'',
        note:(val('inquiry_note')||b.note||'')+'\\n\\n[CRM_BUYER]\\nhome_id='+homeId+'\\n[/CRM_BUYER]'
      };
      const {data:updated,error:updateError}=await client.from('buyers').update(buyerUpdate).eq('id',b.id).select().single();
      if(updateError)throw updateError;
      const idx=db.buyers.findIndex(x=>Number(x.id)===Number(b.id));
      if(idx>=0)db.buyers[idx]=updated;
    }else{
      const buyerNote=val('inquiry_note')||('Shu uyga murojaat qilgan mijoz: '+(h.title||''));
      const buyerMeta='[CRM_BUYER]\\nhome_id='+homeId+'\\nrooms_min='+Number(h.rooms||0)+'\\nrooms_max='+Number(h.rooms||0)+'\\nfloor_min=0\\nfloor_max=0\\n[/CRM_BUYER]';
      const buyerRow={
        name,
        phone,
        city:h.city||'',
        area:h.area||'',
        rooms:Number(h.rooms)||0,
        m2:Number(h.m2)||0,
        budget:Number(h.price)||0,
        finish:h.finish||'',
        type:'',
        note:(buyerNote?buyerNote+'\\n\\n':'')+buyerMeta,
        owner_staff_id: currentStaff?.id || null
      };
      const {data:buyerData,error:buyerError}=await client.from('buyers').insert(buyerRow).select().single();
      if(buyerError)throw buyerError;
      db.buyers.unshift(buyerData);
    }

    closeModal();
    render('homes');
    alert('Mijoz saqlandi. U umumiy “Xaridorlar” bazasiga ham qo‘shildi. 🎯 Mos uylar orqali boshqa mos uylarni ko‘rishingiz mumkin.');
  }catch(err){
    alert('Saqlashda xatolik: '+(err.message||err));
  }
}

async function addStaff(){
  if(!requirePage('staff'))return;
  const name=val('staff_name'),phone=val('staff_phone');
  const login=String(val('staff_login')||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
  const password=String(val('staff_password')||'');
  if(!name||!phone||!login||!password){alert('Ism, telefon, login va parolni kiriting.');return;}
  if(login.length<3){alert('Login kamida 3 ta belgidan iborat bo‘lsin.');return;}
  if(password.length<6){alert('Parol kamida 6 ta belgidan iborat bo‘lsin.');return;}
  if(currentRole()!=='Admin'){alert('Xodim akkauntini faqat Admin yaratadi.');return;}
  const {data:exists,error:existsErr}=await client.from('staff').select('id').eq('login',login).limit(1);
  if(existsErr)return alert('Loginni tekshirishda xatolik: '+existsErr.message);
  if(exists?.length){alert('Bu login band. Boshqa login tanlang.');return;}
  const {data:sessionData}=await client.auth.getSession();
  const adminSession=sessionData?.session||null;
  if(!adminSession){alert('Admin sessiyasi topilmadi. Qayta kiring.');return;}
  const managerVal=val('staff_manager');
  const payload={
    name,phone,login,password,
    role:val('staff_role')||'Agent',
    manager_id:managerVal?Number(managerVal):null,
    is_active:val('staff_active')!=='false'
  };
  try{
    const r=await fetch(SUPABASE_URL+'/functions/v1/create-staff',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+adminSession.access_token},
      body:JSON.stringify(payload)
    });
    const out=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(out.error||out.message||('HTTP '+r.status));
    if(!out.staff)throw new Error('Xodim bazaga qaytmadi.');
    db.staff.unshift(out.staff);closeModal();go('staff');
    alert('Xodim muvaffaqiyatli yaratildi. Endi u Login + Parol bilan kiradi.');
  }catch(e){
    console.error(e);
    alert('Xodim yaratishda xatolik: '+(e.message||e));
  }
}

async function saveStaff(id){
  if(!requirePage('staff'))return;
  if(currentRole()!=='Admin'){alert('Xodim ma’lumotlarini faqat Admin tahrirlaydi.');return;}
  const x=db.staff.find(a=>Number(a.id)===Number(id));if(!x)return;
  const name=val('staff_name'),phone=val('staff_phone'),newPassword=String(val('staff_password')||'');
  if(!name||!phone){alert('Ism va telefonni kiriting.');return;}
  const managerVal=val('staff_manager');
  const row={name,phone,email:val('staff_email')||null,role:val('staff_role')||'Agent',manager_id:managerVal?Number(managerVal):null,is_active:val('staff_active')!=='false'};
  const {data,error}=await client.from('staff').update(row).eq('id',id).select().single();
  if(error)return alert('Xodimni yangilashda xatolik: '+error.message);
  if(newPassword){
    alert('Email/parolni yangilash uchun ushbu xodimning Auth akkauntini ham yangilash kerak. Hozir email maydoni CRM bazasida yangilandi.');
  }
  const idx=db.staff.findIndex(a=>Number(a.id)===Number(id));if(idx>=0)db.staff[idx]=data;
  closeModal();go('staff');
}
async function toggleStaff(id,active){
  if(!requirePage('staff'))return;
  if(currentRole()!=='Admin'){alert('Xodim holatini faqat Admin o‘zgartiradi.');return;}
  const x=db.staff.find(a=>Number(a.id)===Number(id));if(!x)return;
  if(String(x.role||'').toLowerCase()==='admin'){alert('Admin akkauntini o‘zgartirish mumkin emas.');return;}
  const newState=active===true||active==='true';
  const {data,error}=await client.from('staff').update({is_active:newState}).eq('id',id).select().single();
  if(error)return alert('Holatni o‘zgartirishda xatolik: '+error.message);
  Object.assign(x,data);render('staff');
}
async function deleteStaff(id){
  if(!requirePage('staff'))return;
  if(currentRole()!=='Admin'){alert('Xodimni faqat Admin o‘chira oladi.');return;}
  const x=db.staff.find(a=>Number(a.id)===Number(id));if(!x)return;
  if(String(x.role||'').toLowerCase()==='admin'){alert('Admin akkauntini o‘chirish mumkin emas.');return;}
  if(!confirm(`${x.name} xodimini o‘chirishni tasdiqlaysizmi?`))return;
  const {error}=await client.from('staff').delete().eq('id',id);
  if(error)return alert('O‘chirishda xatolik: '+error.message);
  db.staff=db.staff.filter(a=>Number(a.id)!==Number(id));render('staff');
}

function crmMeta(note,key){
  const m=String(note||'').match(new RegExp('\\['+key+'\\]([\\s\\S]*?)\\[\\/'+key+'\\]'));
  if(!m)return {};
  const out={};
  m[1].split(/\r?\n/).forEach(line=>{
    const i=line.indexOf('=');
    if(i>0)out[line.slice(0,i).trim()]=line.slice(i+1).trim();
  });
  return out;
}
function visibleNote(note){
  return String(note||'')
    .replace(/\[CRM_HOME\][\s\S]*?\[\/CRM_HOME\]/g,'')
    .replace(/\[CRM_BUYER\][\s\S]*?\[\/CRM_BUYER\]/g,'')
    .replace(/\[PROPERTY_IMAGES\][\s\S]*?\[\/PROPERTY_IMAGES\]/g,'')
    .replace(/\[CRM_OWNER\][\s\S]*?\[\/CRM_OWNER\]/g,'')
    .trim();
}
function buyerReq(b){
  const m=crmMeta(b.note,'CRM_BUYER');
  const rmin=Number(m.rooms_min||b.rooms||0), rmax=Number(m.rooms_max||b.rooms||0);
  const fmin=m.floor_min===''||m.floor_min===undefined?0:Number(m.floor_min||0);
  const fmax=m.floor_max===''||m.floor_max===undefined?0:Number(m.floor_max||0);
  return {rmin:rmin||0,rmax:rmax||rmin||0,fmin,fmax};
}
function homeFloor(h){
  const m=crmMeta(h.note,'CRM_HOME');
  return Number(m.floor||0);
}
function allBuyersForMatching(){
  const out=[...db.buyers];
  const phones=new Set(out.map(b=>String(b.phone||'')));
  (db.inquiries||[]).forEach(q=>{
    const phone=String(q.phone||'');
    if(!phone||phones.has(phone))return;
    const h=db.homes.find(x=>Number(x.id)===Number(q.home_id));
    out.push({
      id:'inq_'+q.id,name:q.name,phone:q.phone,
      city:h?.city||'',area:h?.area||'',
      rooms:Number(h?.rooms)||0,m2:Number(h?.m2)||0,budget:Number(h?.price)||0,
      finish:'',type:h?.type||'',note:q.note||'',["_inquiry"]:true,
      _floor:Number(h?.note?homeFloor(h):0)||0
    });
    phones.add(phone);
  });
  return out;
}
function findHomes(b){
  const req=buyerReq(b);
  return db.homes.filter(h=>{
    if(h.status==='Sotildi')return false;
    const priceOk=moneyCurrency(h.price)===moneyCurrency(b.budget)&&moneyAmount(h.price)<=moneyAmount(b.budget);
    const roomOk=Number(h.rooms)>=req.rmin&&Number(h.rooms)<=req.rmax;
    const hf=homeFloor(h);
    const floorOk=(!req.fmin&&!req.fmax)||(hf>=req.fmin&&(req.fmax?hf<=req.fmax:true));
    const typeOk=!b.type||b.type==='Farqi yo‘q'||b.type===h.type;
    return priceOk&&roomOk&&floorOk&&typeOk;
  });
}
function findBuyers(h){
  const hf=homeFloor(h);
  return allBuyersForMatching().filter(b=>{
    const req=buyerReq(b);
    const priceOk=moneyCurrency(b.budget)===moneyCurrency(h.price)&&moneyAmount(b.budget)>=moneyAmount(h.price);
    const roomOk=Number(h.rooms)>=req.rmin&&Number(h.rooms)<=req.rmax;
    const floorOk=(!req.fmin&&!req.fmax)||(hf>=req.fmin&&(req.fmax?hf<=req.fmax:true));
    const typeOk=!b.type||b.type==='Farqi yo‘q'||b.type===h.type;
    return priceOk&&roomOk&&floorOk&&typeOk;
  });
}

function previewHomeImages(event){

  if(!box)return;
  box.innerHTML='';
  files.slice(0,10).forEach(file=>{
    if(!file.type.startsWith('image/'))return;
    const url=URL.createObjectURL(file);
    const img=document.createElement('img');
    img.src=url;
    img.onload=()=>URL.revokeObjectURL(url);
    box.appendChild(img);
  });
  if(files.length>10){
    alert('Ko‘pi bilan 10 ta rasm tanlang.');
    event.target.value='';
    box.innerHTML='';
  }

function previewPropertyImages(event){
  const files=[...(event.target.files||[])];
  const box=document.getElementById('pf_image_preview');
  box.innerHTML='';
  files.slice(0,10).forEach(file=>{
    const url=URL.createObjectURL(file);
    const img=document.createElement('img');
    img.src=url;
    img.onload=()=>URL.revokeObjectURL(url);
    box.appendChild(img);
  });
  if(files.length>10){
    alert('Ko‘pi bilan 10 ta rasm tanlang.');
    event.target.value='';
    box.innerHTML='';
  }
}

async function uploadPropertyImages(files, title){
  const urls=[];
  const safeTitle=(title||'uy').toString().toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'uy';
  for(let i=0;i<files.length;i++){
    const file=files[i];
    if(!file.type.startsWith('image/')) throw new Error('Faqat rasm fayllarini yuklang.');
    if(file.size>50*1024*1024) throw new Error('Har bir rasm 50 MB dan katta bo‘lmasin.');
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path=`${Date.now()}-${safeTitle}-${i+1}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const up=await client.storage.from('property-images').upload(path,file,{upsert:false,contentType:file.type});
    if(up.error) throw up.error;
    const pub=client.storage.from('property-images').getPublicUrl(path);
    urls.push(pub.data.publicUrl);
  }
  return urls;
}
