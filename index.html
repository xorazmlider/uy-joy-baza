      padding: 13px;

async function loadHomes() {

  const box =
    document.getElementById("homes");


  box.innerHTML =
    "Yuklanmoqda...";


  const { data, error } =
    await db
      .from("homes")
      .select("*")
      .order("id", {
        ascending: false
      });


  if (error) {

    box.innerHTML =
      "❌ XATO: " +
      error.message;

    console.log(error);

    return;

  }


  if (!data || data.length === 0) {

    box.innerHTML =
      "Hozircha uylar yo‘q.";

    return;

  }


  box.innerHTML =

    data.map(function(home) {

      return `

        <div class="home">

          <h3>
            🏠 ${home.title || ""}
          </h3>

          <p>
            📍 Shahar:
            ${home.city || ""}
          </p>

          <p>
            📌 Hudud:
            ${home.area || ""}
          </p>

          <p>
            🛏 Xonalar:
            ${home.rooms || ""}
          </p>

          <p>
            📐 Maydon:
            ${home.m2 || ""} m²
          </p>

          <p>
            💰 Narx:
            ${home.price || ""}
          </p>

          <p>
            🏷 Turi:
            ${home.type || ""}
          </p>

          <p>
            🔨 Ta’miri:
            ${home.finish || ""}
          </p>

        </div>

      `;

    }).join("");

}


loadHomes();

</script>
