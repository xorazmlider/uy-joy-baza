<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xorazm Uylar CRM</title>
<style>
:root{--ink:#172033;--muted:#6b7280;--line:#e7eaf0;--bg:#f6f7fb;--card:#fff;--accent:#111827;--accent2:#24324a;--green:#16a34a;--red:#dc2626;--shadow:0 8px 28px rgba(15,23,42,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f8f9fc 0%,#f3f5f9 100%);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}
.side{width:250px;background:linear-gradient(180deg,#0d1422 0%,#111827 100%);color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0;box-shadow:8px 0 28px rgba(15,23,42,.08);z-index:10}.brand{font-size:21px;font-weight:850;line-height:1.2;padding:8px 10px 22px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.08)}.nav{display:block;width:100%;text-align:left;background:transparent;color:#b9c3d4;border:0;border-radius:12px;padding:12px 13px;margin:5px 0;font-weight:650;transition:.18s}.nav.active,.nav:hover{background:rgba(255,255,255,.11);color:#fff;transform:translateX(2px)}
.main{margin-left:250px;width:calc(100% - 250px);padding:30px;max-width:1550px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.title{font-size:30px;font-weight:850;letter-spacing:-.6px}.sub{color:var(--muted);margin-top:4px}.btn{border:0;border-radius:12px;background:var(--accent);color:#fff;padding:11px 16px;font-weight:750;box-shadow:0 5px 14px rgba(17,24,39,.13);transition:.18s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(17,24,39,.17)}.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.stat{background:rgba(255,255,255,.9);border-radius:18px;padding:20px;border:1px solid var(--line);box-shadow:var(--shadow);transition:.18s}.stat:hover{transform:translateY(-2px)}.num{font-size:30px;font-weight:850;letter-spacing:-.5px}.label{color:var(--muted);font-size:13px;margin-top:4px}
.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:220px;padding:12px 14px;border:1px solid #dfe3ea;border-radius:12px;background:#fff;outline:none}.search:focus,.field:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(100,116,139,.12)}.filters{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 12px;border:1px solid #dfe3ea;border-radius:999px;background:#fff}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:17px}.card{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#fff;box-shadow:0 5px 20px rgba(15,23,42,.05);transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(15,23,42,.1)}.pic{height:175px;background:linear-gradient(135deg,#e8ebf0,#dfe4ec);display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.cardbody{padding:15px}.price{font-size:20px;font-weight:850;letter-spacing:-.3px}.muted{font-size:13px;color:var(--muted);line-height:1.55}.actions{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}.small{padding:8px 11px;border-radius:9px;border:1px solid #dfe3ea;background:#fff;font-weight:650;transition:.15s}.small:hover{background:#f5f6f8}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.table{width:100%;border-collapse:separate;border-spacing:0}.table th,.table td{padding:13px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:14px}.table th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#7b8494;background:#f8f9fb}.empty{text-align:center;color:#777;padding:45px}.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.58);backdrop-filter:blur(3px);z-index:200;align-items:center;justify-content:center;padding:15px}.box{background:#fff;border-radius:20px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 24px 70px rgba(15,23,42,.25)}.box h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{padding:12px 13px;border:1px solid #dfe3ea;border-radius:11px;width:100%;background:#fff;outline:none}.full{grid-column:1/-1}.match{border-left:4px solid var(--accent);padding:13px;background:#f8f9fb;border-radius:10px;margin:9px 0}.danger{color:#b91c1c}.mobile-nav{display:none}
.public-wrap{min-height:100vh;background:#f5f6f8;padding:24px}.public-box{width:min(680px,100%);margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:var(--shadow)}.public-logo{text-align:center;font-size:25px;font-weight:850;margin-bottom:8px}.public-sub{text-align:center;color:#6b7280;margin-bottom:24px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.choice{border:0;border-radius:16px;padding:24px 15px;background:var(--accent);color:#fff;font-weight:800;font-size:17px}.choice.buy{background:#fff;color:var(--ink);border:2px solid var(--accent)}.public-form{display:none}.public-form.show{display:block}.back{background:#fff;color:var(--ink);border:1px solid #ddd;margin-bottom:15px}.public-field{margin-bottom:12px}.public-field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.public-field input,.public-field select,.public-field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}.public-field textarea{min-height:90px;resize:vertical}.public-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.public-full{grid-column:1/-1}.public-submit{width:100%;margin-top:8px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:800}.public-note{font-size:12px;color:#6b7280;text-align:center;margin-top:14px}.public-success{display:none;text-align:center;padding:30px 10px}.public-success.show{display:block}.image-help{font-size:12px;color:#6b7280;margin-top:5px}.image-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.image-preview img{width:82px;height:68px;object-fit:cover;border-radius:9px;border:1px solid #ddd}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
@media(max-width:800px){.side{display:none}.main{margin:0;width:100%;padding:82px 14px 18px}.stats{grid-template-columns:1fr 1fr;gap:11px}.stat{padding:15px;border-radius:15px}.num{font-size:25px}.top{align-items:flex-start;margin-bottom:17px}.title{font-size:23px}.mobile-nav{display:flex;position:fixed;top:0;bottom:auto;left:0;right:0;height:64px;background:rgba(255,255,255,.97);border-bottom:1px solid #e4e7ec;z-index:100;justify-content:flex-start;align-items:center;padding:6px 7px;gap:3px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;box-shadow:0 4px 16px rgba(15,23,42,.09);backdrop-filter:blur(10px)}.mobile-nav button{flex:0 0 auto;min-width:67px;height:50px;border:0;background:none;color:#566071;border-radius:11px;font-size:11px;line-height:16px;padding:4px 7px;white-space:nowrap;font-weight:650}.mobile-nav button:hover,.mobile-nav button:active{background:#eef1f5;color:#111827}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.table{min-width:650px}.tablewrap{overflow:auto}.panel{padding:15px}.card{border-radius:15px}.pic{height:155px}.toolbar{gap:8px}}
@media(max-width:600px){.public-wrap{padding:12px}.public-box{padding:18px}.choice-grid,.public-grid{grid-template-columns:1fr}.public-full{grid-column:auto}}
</style>
</head>
<body>

<div id="publicApp" style="display:none"></div>

<div class="app">
<aside class="side"><div class="brand">🏠 Xorazm Uylar CRM</div>
<button class="nav active" data-page="dashboard">📊 Bosh sahifa</button><button class="nav" data-page="homes">🏠 Uylar</button><button class="nav" data-page="buyers">👤 Xaridorlar</button><button class="nav" data-page="sellers">🤝 Sotuvchilar</button><button class="nav" data-page="matches">🎯 Moslashtirish</button><button class="nav" data-page="sold">✅ Sotilgan</button>
<div style="margin-top:30px;color:#94a3b8;font-size:12px">Online versiya • ma'lumotlar Supabase bazasida saqlanadi</div></aside>
<main class="main"><div id="page"></div></main>
</div>
<div class="mobile-nav"><button onclick="go('dashboard')">📊<br>Bosh</button><button onclick="go('homes')">🏠<br>Uylar</button><button onclick="go('buyers')">👤<br>Xaridor</button><button onclick="go('sellers')">🤝<br>Sotuvchi</button><button onclick="go('matches')">🎯<br>Mos</button><button onclick="go('sold')">✅<br>Sotilgan</button></div>
<div id="modal" class="modal"><div class="box" id="modalBox"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://rmelwwzaagyzdcrdpkva.supabase.co';
const SUPABASE_KEY='sb_publishable_itMmxW5YPm87O6tADGIEYw_xrs2xNe-';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const KEY='xucrm_v2';
let db={homes:[],buyers:[],sellers:[]};

const localDb=JSON.parse(localStorage.getItem(KEY)||'null');

async function loadDb(){
  const [h,b,s]=await Promise.all([
    client.from('homes').select('*').order('created_at',{ascending:false}),
    client.from('buyers').select('*').order('created_at',{ascending:false}),
    client.from('sellers').select('*').order('created_at',{ascending:false})
  ]);
  if(h.error) throw h.error;
  if(b.error) throw b.error;
  if(s.error) throw s.error;

  const cloudEmpty=!h.data.length&&!b.data.length&&!s.data.length;
  const hasLocal=localDb && (localDb.homes?.length||localDb.buyers?.length||localDb.sellers?.length);

  if(cloudEmpty && hasLocal){
    const clean=(x)=>{const y={...x};delete y.id;delete y.created_at;return y};
    if(localDb.homes?.length) await client.from('homes').insert(localDb.homes.map(clean));
    if(localDb.buyers?.length) await client.from('buyers').insert(localDb.buyers.map(clean));
    if(localDb.sellers?.length) await client.from('sellers').insert(localDb.sellers.map(clean));
    localStorage.removeItem(KEY);
    return loadDb();
  }

  db={homes:h.data||[],buyers:b.data||[],sellers:s.data||[]};
}

async function refresh(){
  try{await loadDb();render();}
  catch(e){
    console.error(e);
    document.getElementById('page').innerHTML=
      `<div class="panel"><h2>⚠️ Baza bilan ulanishda xatolik</h2>
      <p>${esc(e.message||e)}</p>
      <p class="muted">Supabase loyihasi va jadvallarni tekshiring.</p></div>`;
  }
}

function money(n){if(!n)return '—';n=Number(n);if(n>=1e9)return (n/1e9).toFixed(2)+' mlrd so‘m';return Math.round(n/1e6)+' mln so‘m'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function go(p){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render(p)}
function header(t,sub,btn,fn){return `<div class="top"><div><div class="title">${t}</div><div class="sub">${sub}</div></div>${btn?`<button class="btn" onclick="${fn}">${btn}</button>`:''}</div>`}
function render(p='dashboard'){
  let h='';
  if(p==='dashboard')h=dashboard();
  if(p==='homes')h=homes();
  if(p==='buyers')h=buyers();
  if(p==='sellers')h=sellers();
  if(p==='matches')h=matches();
  if(p==='sold')h=soldHomes();
  document.getElementById('page').innerHTML=h;
}
function dashboard(){
  return header('Xorazm Uylar CRM','Sotuvchi, xaridor va uylar bazasi','📲 Instagram ariza linki','openInstagramLink()')+
  `<div style="margin-bottom:15px"><button class="btn" onclick="openBuyer()">+ Yangi mijoz</button></div>`+
  `<div class="stats"><div class="stat"><div class="num">${db.homes.filter(x=>x.status!=='Sotildi').length}</div><div class="label">Faol uylar</div></div><div class="stat"><div class="num">${db.buyers.length}</div><div class="label">Xaridorlar</div></div><div class="stat"><div class="num">${db.sellers.length}</div><div class="label">Sotuvchilar</div></div><div class="stat" onclick="go('sold')" style="cursor:pointer"><div class="num">${db.homes.filter(x=>x.status==='Sotildi').length}</div><div class="label">Sotilgan uylar</div></div></div>
  <div class="panel"><h3>🎯 Tezkor moslashtirish</h3><p class="sub">Xaridor va uy parametrlarini solishtiring.</p>${db.buyers.slice(0,5).map(b=>`<div class="match"><b>${esc(b.name)}</b> — ${esc(b.city)}, ${esc(b.area)}, ${b.rooms} xona, ${b.m2} m², ${money(b.budget)} gacha<br><button class="small primary" onclick="showBuyerMatches(${b.id})">Mos uylarni ko‘rsatish</button></div>`).join('')||'<div class="empty">Hali xaridor yo‘q.</div>'}</div>`;
}
function homes(){
  return header('Uylar','Faol sotiladigan uylar bazasi','+ Uy qo‘shish','openHome()')+
  `<div class="panel"><div class="toolbar"><input class="search" placeholder="Uy, hudud, manzil yoki narx..." oninput="filterHomes(this.value)"><button class="btn light" onclick="clearData('homes')">Tozalash</button></div><div id="homeList">${homeCards(db.homes.filter(x=>x.status!=='Sotildi'))}</div></div>`;
}
function getImageUrls(note){
  const m=String(note||'').match(/\[PROPERTY_IMAGES\]([\s\S]*?)\[\/PROPERTY_IMAGES\]/);
  return m ? m[1].split(/\r?\n/).map(s=>s.trim()).filter(Boolean) : [];
}
function homeCards(a){return `<div class="grid">${a.map(x=>{
  const imgs=getImageUrls(x.note);
  const cover=imgs[0] ? `<img src="${esc(imgs[0])}" style="width:100%;height:155px;object-fit:cover" onerror="this.style.display='none';this.parentElement.innerHTML='🏠'">` : '🏠';
  return `<div class="card"><div class="pic">${cover}</div><div class="cardbody"><div class="price">${money(x.price)}</div><b>${esc(x.title)}</b><div class="muted">📍 ${esc(x.city)} • ${esc(x.area)}</div><div class="muted">🏠 ${x.rooms} xona • 📐 ${x.m2} m² • ${esc(x.finish)}</div><div class="muted">👤 ${esc(x.seller)} • ${esc(x.phone)}</div>${imgs.length?`<div class="muted">📷 ${imgs.length} ta rasm</div>`:''}<div class="actions"><button class="small primary" onclick="showHomeMatches(${x.id})">🎯 Xaridorlar</button><button class="small" onclick="editHome(${x.id})">Tahrir</button></div></div></div>`;
}).join('')||'<div class="empty">Uylar topilmadi.</div>'}</div>`}
function filterHomes(q){q=q.toLowerCase();document.getElementById('homeList').innerHTML=homeCards(db.homes.filter(x=>x.status!=='Sotildi'&&JSON.stringify(x).toLowerCase().includes(q)))}
function soldHomes(){
  const sold=db.homes.filter(x=>x.status==='Sotildi');
  return header('Sotilgan uylar','Sotilgan uylar arxivi')+
    `<div class="panel"><div id="soldHomeList">${homeCards(sold)}</div></div>`;
}
function buyers(){return header('Xaridorlar','Sizga uy qidirayotgan mijozlar','+ Xaridor qo‘shish','openBuyer()')+
  `<div class="panel"><div class="toolbar"><input class="search" placeholder="Ism, telefon, hudud..." oninput="filterBuyers(this.value)"></div><div id="buyerList">${buyerRows(db.buyers)}</div></div>`}
function buyerRows(a){return `<div class="tablewrap"><table class="table"><tr><th>Mijoz</th><th>Talab</th><th>Budjet</th><th>Aloqa</th><th></th></tr>${a.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.note)}</span></td><td>${esc(x.city)} • ${esc(x.area)}<br>${x.rooms} xona • ${x.m2} m² • ${esc(x.finish)}</td><td>${money(x.budget)} gacha</td><td>${esc(x.phone)}</td><td><button class="small primary" onclick="showBuyerMatches(${x.id})">🎯 Mos uylar</button> <button class="small" onclick="editBuyer(${x.id})">Tahrir</button> <button class="small" onclick="del('buyers',${x.id})">×</button></td></tr>`).join('')}</table></div>`}
function filterBuyers(q){q=q.toLowerCase();document.getElementById('buyerList').innerHTML=buyerRows(db.buyers.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))}
function sellers(){return header('Sotuvchilar','Uy egalari va realtorlar bazasi','+ Sotuvchi qo‘shish','openSeller()')+
  `<div class="panel"><div class="tablewrap"><table class="table"><tr><th>Ism</th><th>Telefon</th><th>Izoh</th><th></th></tr>${db.sellers.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.note)}</td><td><button class="small" onclick="del('sellers',${x.id})">O‘chirish</button></td></tr>`).join('')}</table></div></div>`}
function matches(){return header('Moslashtirish','Xaridor ↔ uy parametrlarini avtomatik solishtirish','+ Xaridor','openBuyer()')+
  `<div class="panel"><h3>Kimga qanday uy?</h3>${db.buyers.map(b=>{let m=findHomes(b);return `<div class="match"><b>👤 ${esc(b.name)}</b> — ${m.length} ta mos uy<br><span class="muted">${esc(b.city)}, ${esc(b.area)}, ${b.rooms} xona, ${b.m2} m², ${money(b.budget)} gacha</span><div>${m.slice(0,3).map(x=>`<div style="margin-top:8px">🏠 <b>${esc(x.title)}</b> — ${money(x.price)} <button class="small primary" onclick="showHome(${x.id})">Ko‘rish</button></div>`).join('')||'<span class="muted">Mos uy topilmadi.</span>'}</div></div>`}).join('')||'<div class="empty">Xaridor bazasi bo‘sh.</div>'}</div>`}
function findHomes(b){return db.homes.filter(h=>h.status!=='Sotildi'&&(h.city===b.city)&&(!b.area||h.area.toLowerCase().includes(b.area.toLowerCase())||b.area.toLowerCase().includes(h.area.toLowerCase()))&&(Number(h.rooms)===Number(b.rooms))&&(Number(h.m2)>=Number(b.m2)*.85&&Number(h.m2)<=Number(b.m2)*1.2)&&(Number(h.price)<=Number(b.budget))&&(!b.finish||h.finish===b.finish))}
function findBuyers(h){return db.buyers.filter(b=>b.city===h.city&&Number(b.rooms)===Number(h.rooms)&&Number(b.m2)>=Number(h.m2)*.85&&Number(b.m2)<=Number(h.m2)*1.2&&Number(b.budget)>=Number(h.price)&&(!b.finish||b.finish===h.finish))}
function showBuyerMatches(id){let b=db.buyers.find(x=>x.id===id),m=findHomes(b);if(!b)return;modal(`<h2>🎯 ${esc(b.name)} uchun mos uylar</h2><p>${esc(b.city)} • ${esc(b.area)} • ${b.rooms} xona • ${b.m2} m² • ${money(b.budget)} gacha</p>${m.map(x=>`<div class="match"><b>${esc(x.title)}</b><br>${esc(x.city)} • ${esc(x.area)} • ${x.rooms} xona • ${x.m2} m²<br><b>${money(x.price)}</b> • 📞 ${esc(x.phone)}<br><button class="small primary" onclick="showHome(${x.id})">Uy tafsiloti</button></div>`).join('')||'<div class="empty">Aniq mos uy topilmadi.</div>'}<button class="btn light" onclick="closeModal()">Yopish</button>`)}
function showHomeMatches(id){let h=db.homes.find(x=>x.id===id),m=findBuyers(h);if(!h)return;modal(`<h2>🎯 ${esc(h.title)} uchun mos xaridorlar</h2><p>${esc(h.city)} • ${esc(h.area)} • ${h.rooms} xona • ${h.m2} m² • ${money(h.price)}</p>${m.map(x=>`<div class="match"><b>${esc(x.name)}</b><br>${esc(x.city)} • ${esc(x.area)} • ${x.rooms} xona • ${x.m2} m²<br>Budjet: ${money(x.budget)} gacha • 📞 ${esc(x.phone)}<br><span class="muted">${esc(x.note)}</span></div>`).join('')||'<div class="empty">Mos xaridor topilmadi.</div>'}<button class="btn light" onclick="closeModal()">Yopish</button>`)}
function showHome(id){
  let x=db.homes.find(a=>a.id===id);if(!x)return;
  const imgs=getImageUrls(x.note);
  const gallery=imgs.length?`<div class="image-preview" style="margin-bottom:12px">${imgs.map(u=>`<img src="${esc(u)}" style="width:120px;height:90px" onclick="window.open('${esc(u)}','_blank')" title="Rasmni ochish">`).join('')}</div>`:'';
  const cleanNote=String(x.note||'').replace(/\n?\n?\[PROPERTY_IMAGES\][\s\S]*?\[\/PROPERTY_IMAGES\]/g,'').trim();
  modal(`<h2>${esc(x.title)}</h2>${gallery}<div class="match"><b>${money(x.price)}</b><br>📍 ${esc(x.city)}, ${esc(x.area)}<br>🏠 ${x.rooms} xona • 📐 ${x.m2} m²<br>🔑 ${esc(x.finish)}<br>👤 ${esc(x.seller)} • 📞 ${esc(x.phone)}${cleanNote?`<br>${esc(cleanNote)}`:''}</div><button class="btn light" onclick="closeModal()">Yopish</button>`);
}

    const existing=getImageUrls(x.note);
    const preview=document.getElementById('f_image_preview');
    if(preview && existing.length) preview.innerHTML=existing.map(u=>`<img src="${esc(u)}" onerror="this.style.display='none'">`).join('');
    const btn=document.querySelector('#modalBox .btn');
    if(btn){

    }
    const cancelBtn=Array.from(document.querySelectorAll('#modalBox button')).find(b=>b.textContent.trim()==='Bekor');
    if(cancelBtn) cancelBtn.insertAdjacentHTML('beforebegin',' ');
    btn.onclick=async()=>{
      try{
        const imageInput=document.getElementById('f_images');
        const files=[...(imageInput?.files||[])];
        if(files.length>10){alert('Ko‘pi bilan 10 ta rasm tanlang.');return;}
        let imageUrls=existing;
        if(files.length) imageUrls=await uploadPropertyImages(files,val('title'));
        let note=val('note').replace(/\n?\n?\[PROPERTY_IMAGES\][\s\S]*?\[\/PROPERTY_IMAGES\]/g,'').trim();
        if(imageUrls.length) note=(note?'\\n\\n':'')+'[PROPERTY_IMAGES]\\n'+imageUrls.join('\\n')+'\\n[/PROPERTY_IMAGES]';

function previewPropertyImages(event){
  const files=[...(event.target.files||[])];
  const box=document.getElementById('pf_image_preview');
  box.innerHTML='';
  files.slice(0,10).forEach(file=>{
    const url=URL.createObjectURL(file);
    const img=document.createElement('img');

    img.onload=()=>URL.revokeObjectURL(url);
    box.appendChild(img);

  if(files.length>10){
    alert('Ko‘pi bilan 10 ta rasm tanlang.');
    event.target.value='';
    box.innerHTML='';
  }
}

async function uploadPropertyImages(files, title){
  const urls=[];
  const safeTitle=(title||'uy').toString().toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'uy';
  for(let i=0;i<files.length;i++){
    const file=files[i];
    if(!file.type.startsWith('image/')) throw new Error('Faqat rasm fayllarini yuklang.');
    if(file.size>50*1024*1024) throw new Error('Har bir rasm 50 MB dan katta bo‘lmasin.');
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path=`${Date.now()}-${safeTitle}-${i+1}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const up=await client.storage.from('property-images').upload(path,file,{upsert:false,contentType:file.type});
    if(up.error) throw up.error;
    const pub=client.storage.from('property-images').getPublicUrl(path);
    urls.push(pub.data.publicUrl);
  }
  return urls;
}

async function submitPublicSell(){
  const name=pf('seller_name'), phone=pf('seller_phone'), title=pf('title');
  if(!name||!phone||!title){alert('Iltimos, ism, telefon va uy nomini kiriting.');return;}

  const imageInput=document.getElementById('pf_images');
  const files=[...(imageInput?.files||[])];
  if(files.length>10){alert('Ko‘pi bilan 10 ta rasm yuborish mumkin.');return;}

  const submit=document.querySelector('#publicForm .public-submit:last-of-type');
  if(submit){submit.disabled=true;submit.textContent='Yuklanmoqda...';}

  try{
    const sellerRow={name,phone,note:'Instagram ariza'};
    const sellerRes=await client.from('sellers').insert(sellerRow).select().single();
    if(sellerRes.error) throw sellerRes.error;

    let imageUrls=[];
    if(files.length) imageUrls=await uploadPropertyImages(files,title);

    let note=pf('note');
    if(imageUrls.length){
      note=(note?note+'\n\n':'')+'[PROPERTY_IMAGES]\n'+imageUrls.join('\n')+'\n[/PROPERTY_IMAGES]';
    }

    const homeRow={
      title,
      city:pf('city'),
      area:pf('area'),
      rooms:Number(pf('rooms'))||0,
      m2:Number(pf('m2'))||0,
      price:Number(pf('price'))||0,
      finish:pf('finish'),
      seller:name,
      phone,
      status:'Faol',
      note
    };
    const homeRes=await client.from('homes').insert(homeRow).select().single();
    if(homeRes.error) throw homeRes.error;

    publicSuccess(imageUrls.length
      ? `Uy ma’lumotlari va ${imageUrls.length} ta rasm qabul qilindi.`
      : 'Uy ma’lumotlaringiz qabul qilindi. Tez orada siz bilan bog‘lanamiz.'
    );
  }catch(err){
    alert('Saqlashda xatolik: '+(err.message||err));
    if(submit){submit.disabled=false;submit.textContent='Yuborish';}
  }
}
