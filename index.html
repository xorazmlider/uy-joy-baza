function normalizeRole(role){
  const r=String(role||'').trim().toLowerCase();
  if(r==='admin')return 'Admin';
  if(r==='menejer'||r==='manager')return 'Menejer';
  if(r==='rieltor'||r==='realtor')return 'Rieltor';
  return 'Agent';
}

async function loadCurrentStaff(){
  const {data:{user}}=await client.auth.getUser();
  currentUser=user||null;
  if(!user){currentStaff=null;return false;}
  const authEmail=String(user.email||'').trim().toLowerCase();
  let {data,error}=await client.from('staff').select('*').ilike('auth_email',authEmail).limit(1);
  if(error)throw error;
  if(!data?.length){
    const r=await client.from('staff').select('*').ilike('email',authEmail).limit(1);
    if(r.error)throw r.error;
    data=r.data||[];
  }
  if(data&&data.length){
    currentStaff=data[0];
    if(currentStaff.is_active===false){
      await client.auth.signOut();
      currentStaff=null;
      alert('Xodim akkaunti faol emas. Admin bilan bog‘laning.');
      return false;
    }
    return true;
  }
  const {data:allStaff,error:allErr}=await client.from('staff').select('id').limit(1);
  if(allErr)throw allErr;
  if(!allStaff?.length){
    currentStaff={id:'bootstrap-admin',name:user.user_metadata?.full_name||user.email,phone:'',email:user.email,auth_email:user.email,login:'admin',role:'Admin',is_active:true};
    return true;
  }
  currentStaff=null;
  await client.auth.signOut();
  throw new Error('Bu akkaunt Xodimlar bazasida ro‘yxatdan o‘tmagan. Admin bilan bog‘laning.');
}

async function loginCRM(event){
  event?.preventDefault();

  const loginValue=String(document.getElementById('loginLogin')?.value||'').trim().toLowerCase();
  const password=document.getElementById('loginPassword').value;
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('loginError');

  err.textContent='';
  if(!loginValue||!password){
    err.textContent='Login va parolni kiriting.';
    return;
  }

  btn.disabled=true;
  btn.textContent='Tekshirilmoqda...';

  try{
    let authEmail='';
    // Admin emaili o‘zgarishsiz. Xodim loginida @ yozish shart emas.
    if(loginValue.includes('@')){
      authEmail=loginValue;
    }else{
      authEmail=loginValue+'@crm.xorazmuylar.uz';
    }
    // Xodim Auth akkaunti create-staff tomonidan shu email bilan yaratiladi.
    // Shuning uchun login vaqtida staff SELECT/RLS ga bog‘lanmaymiz.
    // Masalan: test -> test@crm.xorazmuylar.uz
    // Masalan: anvar22 -> anvar22@crm.xorazmuylar.uz
    // Parol Supabase Auth orqali tekshiriladi.
    // Adminning haqiqiy email bilan kirishi saqlanadi.
    // Xodimning faol holati CRM ichida rolni yuklash bosqichida nazorat qilinadi.
    // LOGIN_NOT_FOUND bu yerda ishlatilmaydi.
    // AUTH_EMAIL_MISSING bu yerda ishlatilmaydi.
    // --------------------------------------------
    // Login emaili tayyor.

    const {data,error}=await client.auth.signInWithPassword({
      email:authEmail,
      password
    });

    if(error)throw error;
    if(!data?.session)throw new Error('SESSION_NOT_CREATED');

    await showCRM();

  }catch(e){
    console.error('CRM login:',e);

    if(e.message==='INACTIVE'){
      err.textContent='Bu xodim faol emas. Admin bilan bog‘laning.';
    }else if(e.message==='AUTH_EMAIL_MISSING'){
      err.textContent='Xodim akkaunti to‘liq sozlanmagan.';
    }else if(/invalid login credentials/i.test(String(e.message||''))){
      err.textContent='Login yoki parol noto‘g‘ri.';
    }else if(/email not confirmed/i.test(String(e.message||''))){
      err.textContent='Bu email Supabase’da tasdiqlanmagan.';
    }else if(/failed to fetch|network/i.test(String(e.message||''))){
      err.textContent='Internet yoki Supabase ulanishida xatolik.';
    }else{
      err.textContent='Kirishda xatolik: '+String(e.message||e);
    }
  }finally{
    btn.disabled=false;
    btn.textContent='Kirish';
  }
}

async function loadDb(){
  const base=await Promise.all([
    client.from('homes').select('*').order('created_at',{ascending:false}),
    client.from('buyers').select('*').order('created_at',{ascending:false}),
    client.from('sellers').select('*').order('created_at',{ascending:false}),
    client.from('home_inquiries').select('*').order('created_at',{ascending:false})
  ]);
  const [h,b,s,i]=base;
  if(h.error) throw h.error;
  if(b.error) throw b.error;
  if(s.error) throw s.error;
  if(i.error) throw i.error;
  let staffData=[];
  if(currentRole()==='Admin'||currentRole()==='Menejer'){
    const st=await client.from('staff').select('*').order('created_at',{ascending:false});
    if(st.error) throw st.error;
    staffData=st.data||[];
  }

  const cloudEmpty=!h.data.length&&!b.data.length&&!s.data.length;
  const hasLocal=localDb && (localDb.homes?.length||localDb.buyers?.length||localDb.sellers?.length);

  if(cloudEmpty && hasLocal){
    const clean=(x)=>{const y={...x};delete y.id;delete y.created_at;return y};
    if(localDb.homes?.length) await client.from('homes').insert(localDb.homes.map(clean));
    if(localDb.buyers?.length){
      const migratedBuyers=localDb.buyers.map(x=>({...clean(x),owner_staff_id:currentStaff?.id||null}));
      await client.from('buyers').insert(migratedBuyers);
    }
    if(localDb.sellers?.length) await client.from('sellers').insert(localDb.sellers.map(clean));
    localStorage.removeItem(KEY);
    return loadDb();
  }

  db={homes:h.data||[],buyers:b.data||[],sellers:s.data||[],inquiries:i.data||[],tasks:[],deals:[],activities:[],documents:[],staff:staffData};

  // Professional modules are optional: if their tables are not created yet,
  // the main CRM still works normally.
  const extraTables=[
    ['tasks','crm_tasks'],
    ['deals','crm_deals'],
    ['activities','crm_activities'],
    ['documents','crm_documents']
  ];
  await Promise.all(extraTables.map(async ([key,table])=>{
    try{
      const r=await client.from(table).select('*').order('created_at',{ascending:false});
      if(!r.error) db[key]=r.data||[];
    }catch(e){}
  }));
  ['tasks','deals','activities','documents'].forEach(k=>{
    const local=proLocalGet(k);
    if(local.length) db[k]=[...db[k],...local.filter(l=>!db[k].some(x=>String(x.id)===String(l.id)))];
  });
}

async function refresh(){
  try{await loadDb();render();}
  catch(e){
    console.error(e);
    document.getElementById('page').innerHTML=
      `<div class="panel"><h2>⚠️ Baza bilan ulanishda xatolik</h2>
      <p>${esc(e.message||e)}</p>
      <p class="muted">Supabase loyihasi va jadvallarni tekshiring.</p></div>`;
  }
}

function parseMoneyInput(v){
  const s=String(v??'').trim().replace(/\s/g,'').replace(/,/g,'');
  if(!s)return 0;
  const usd=/\$|usd|dollar|доллар/i.test(s);
  const n=Number(s.replace(/[^0-9.\-]/g,''));
  if(!Number.isFinite(n))return NaN;
  return usd ? -Math.abs(n) : Math.abs(n);
}
function moneyCurrency(n){
  const v=Number(n);
  return v<0?'USD':'UZS';
}
function moneyAmount(n){
  return Math.abs(Number(n)||0);
}
function money(n){
  if(n===null||n===undefined||n===''||!Number.isFinite(Number(n))||Number(n)===0)return '—';
  const v=Number(n), a=Math.abs(v);
  if(v<0)return '$'+Math.round(a).toLocaleString('en-US');
  if(a>=1e9)return (a/1e9).toFixed(2)+' mlrd so‘m';
  return Math.round(a/1e6)+' mln so‘m';
}
function priceInputValue(n){
  if(n===null||n===undefined||n==='')return '';
  const v=Number(n);
  return v<0 ? '$'+Math.round(Math.abs(v)) : String(v);
}

function homeCode(id){
  const n=Number(id);
  return Number.isFinite(n)&&n>0 ? 'XU-'+String(Math.trunc(n)).padStart(6,'0') : 'XU-—';
}

function kpiPlans(note){
  const m=String(note||'').match(/\[CRM_KPI_PLANS\]([\s\S]*?)\[\/CRM_KPI_PLANS\]/);
  if(!m)return {};
  try{return JSON.parse(m[1].trim()||'{}')||{}}catch(e){return {}}
}
function setKpiPlans(note,plans){
  const clean=String(note||'').replace(/\n?\n?\[CRM_KPI_PLANS\][\s\S]*?\[\/CRM_KPI_PLANS\]/g,'').trim();
  return (clean?clean+'\n\n':'')+'[CRM_KPI_PLANS]\n'+JSON.stringify(plans||{})+'\n[/CRM_KPI_PLANS]';
}
function monthKey(date){return String(date||new Date().toISOString()).slice(0,7)}
function monthLabel(key){

function kpiTeamIds(managerId){
  const mid=String(managerId);
  return (db.staff||[]).filter(s=>String(s.manager_id||'')===mid&&s.is_active!==false).map(s=>String(s.id));
}
function kpiFact(staffId,key){
  const sid=String(staffId);
  const staff=db.staff.find(s=>String(s.id)===sid);
  const isManager=staff&&normalizeRole(staff.role)==='Menejer';
  const ids=isManager ? kpiTeamIds(staffId) : [sid];
  if(key==='homes')return db.homes.filter(h=>ids.includes(ownerStaffIdFromHome(h))&&monthKey(h.created_at)===monthKey(kpiCurrentMonth)).length;
  if(key==='buyers')return db.buyers.filter(b=>ids.includes(String(b.owner_staff_id||''))&&monthKey(b.created_at)===monthKey(kpiCurrentMonth)).length;
  if(key==='deals')return (db.deals||[]).filter(d=>ids.includes(String(ownerStaffIdFromNote(d.note,'CRM_DEAL_OWNER')))&&d.stage==='Sotildi'&&monthKey(d.created_at)===monthKey(kpiCurrentMonth)).length;
  if(key==='tasks')return (db.tasks||[]).filter(t=>ids.includes(String(ownerStaffIdFromNote(t.note,'CRM_TASK_OWNER')))&&t.status==='Bajarildi'&&monthKey(t.created_at)===monthKey(kpiCurrentMonth)).length;
  return 0;
}
let kpiCurrentMonth=monthKey(new Date());
function kpiSummary(staff){
  const plans=kpiPlans(staff?.note)[kpiCurrentMonth]||{};
  const isManager=normalizeRole(staff?.role)==='Menejer';
  const rows=isManager
    ? [['homes','Jamoa yangi uylari'],['buyers','Jamoa yangi mijozlari'],['deals','Jamoa sotuvlari'],['tasks','Jamoa bajarilgan vazifalari']]
    : [['homes','Yangi uylar'],['buyers','Yangi mijozlar'],['deals','Sotuvlar'],['tasks','Bajarilgan vazifalar']];
  let sum=0,count=0;
  const out=rows.map(([key,label])=>{const plan=Math.max(0,Number(plans[key]||0));const fact=kpiFact(staff.id,key);const pct=plan?Math.round(fact/plan*100):0;if(plan){sum+=Math.min(pct,100);count++;}return {key,label,plan,fact,pct};});
  return {rows:out,pct:count?Math.round(sum/count):0,isManager};
}

function formatDateTime(v){
  if(!v)return 'Sana belgilanmagan';
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return String(v);
  return d.toLocaleString('uz-UZ',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function proLocalGet(key){
  try{return JSON.parse(localStorage.getItem('xucrm_pro_'+key)||'[]')}catch(e){return []}
}
function proLocalSet(key,val){localStorage.setItem('xucrm_pro_'+key,JSON.stringify(val))}
async function proInsert(table,key,row){
  const r=await client.from(table).insert(row).select().single();
  if(!r.error){
    db[key]=[r.data,...(db[key]||[])];
    return r.data;
  }
  const local={...row,id:'local_'+Date.now()+'_'+Math.random().toString(36).slice(2)};
  const arr=proLocalGet(key);arr.unshift(local);proLocalSet(key,arr);db[key]=[local,...(db[key]||[])];
  return local;
}
async function proUpdate(table,key,id,patch){
  if(String(id).startsWith('local_')){
    const arr=proLocalGet(key).map(x=>String(x.id)===String(id)?{...x,...patch}:x);
    proLocalSet(key,arr);db[key]=db[key].map(x=>String(x.id)===String(id)?{...x,...patch}:x);return;
  }
  const r=await client.from(table).update(patch).eq('id',id).select().single();
  if(r.error){alert('Saqlashda xatolik: '+r.error.message);return;}
  db[key]=db[key].map(x=>Number(x.id)===Number(id)?r.data:x);
}
async function proDelete(table,key,id){
  if(!confirm('O‘chirishni tasdiqlaysizmi?'))return;
  if(String(id).startsWith('local_')){
    const arr=proLocalGet(key).filter(x=>String(x.id)!==String(id));proLocalSet(key,arr);
  }else{
    const r=await client.from(table).delete().eq('id',id);
    if(r.error){alert('O‘chirishda xatolik: '+r.error.message);return;}
  }
  db[key]=db[key].filter(x=>String(x.id)!==String(id));render(key==='tasks'?'tasks':key==='deals'?'deals':key==='documents'?'homes':'buyers');
}

async function saveHomeInquiry(homeId){
  const name=val('inquiry_name'), phone=val('inquiry_phone');
  if(!name||!phone){alert('Mijoz ismi va telefonini kiriting.');return;}
  const h=db.homes.find(x=>Number(x.id)===Number(homeId));
  if(!h){alert('Uy topilmadi.');return;}
  const inquiryRow={
    home_id:homeId,
    name,
    phone,
    status:val('inquiry_status')||'Yangi',
    note:val('inquiry_note')
  };
  try{
    // 1) Uyning murojaatini saqlaymiz.
    const {data,error}=await client.from('home_inquiries').insert(inquiryRow).select().single();
    if(error)throw error;
    db.inquiries.unshift(data);

    // 2) Shu mijozni umumiy Xaridorlar bazasiga ham avtomatik qo‘shamiz.
    // Mijoz faqat ism/telefon/izoh bilan kiritilgani uchun uning talabi
    // murojaat qilgan uy parametrlaridan boshlanadi. Keyin Xaridorlar bo‘limida tahrirlash mumkin.
    const {data:existing,error:findError}=await client.from('buyers').select('*').eq('phone',phone).limit(1);
    if(findError)throw findError;

    if(existing && existing.length){
      const b=existing[0];
      const buyerUpdate={
        name,
        phone,
        city:h.city||b.city||'',
        area:h.area||b.area||'',
        rooms:Number(h.rooms)||Number(b.rooms)||0,
        m2:Number(h.m2)||Number(b.m2)||0,
        budget:Number(h.price)||Number(b.budget)||0,
        finish:h.finish||b.finish||'',
        type:b.type||'',
        note:(val('inquiry_note')||b.note||'')+'\\n\\n[CRM_BUYER]\\nhome_id='+homeId+'\\n[/CRM_BUYER]'
      };
      const {data:updated,error:updateError}=await client.from('buyers').update(buyerUpdate).eq('id',b.id).select().single();
      if(updateError)throw updateError;
      const idx=db.buyers.findIndex(x=>Number(x.id)===Number(b.id));
      if(idx>=0)db.buyers[idx]=updated;
    }else{
      const buyerNote=val('inquiry_note')||('Shu uyga murojaat qilgan mijoz: '+(h.title||''));
      const buyerMeta='[CRM_BUYER]\\nhome_id='+homeId+'\\nrooms_min='+Number(h.rooms||0)+'\\nrooms_max='+Number(h.rooms||0)+'\\nfloor_min=0\\nfloor_max=0\\n[/CRM_BUYER]';
      const buyerRow={
        name,
        phone,
        city:h.city||'',
        area:h.area||'',
        rooms:Number(h.rooms)||0,
        m2:Number(h.m2)||0,
        budget:Number(h.price)||0,
        finish:h.finish||'',
        type:'',
        note:(buyerNote?buyerNote+'\\n\\n':'')+buyerMeta,
        owner_staff_id: currentStaff?.id || null
      };
      const {data:buyerData,error:buyerError}=await client.from('buyers').insert(buyerRow).select().single();
      if(buyerError)throw buyerError;
      db.buyers.unshift(buyerData);
    }

    closeModal();
    render('homes');
    alert('Mijoz saqlandi. U umumiy “Xaridorlar” bazasiga ham qo‘shildi. 🎯 Mos uylar orqali boshqa mos uylarni ko‘rishingiz mumkin.');
  }catch(err){
    alert('Saqlashda xatolik: '+(err.message||err));
  }
}

async function editHomeInquiry(id){
  const q=db.inquiries.find(x=>Number(x.id)===Number(id));
  if(!q)return;
  const h=db.homes.find(x=>Number(x.id)===Number(q.home_id));
  if(!h)return;
  modal(`<h2>✏️ Mijozni tahrirlash</h2>
    ${input('inquiry_name','Mijoz ismi','',1)}
    ${input('inquiry_phone','Telefon','',1)}
    ${input('inquiry_status','Holati','Yangi',1)}
    ${input('inquiry_note','Izoh','',0,true)}<br>
    <button class="btn" onclick="updateHomeInquiry(${id},${h.id})">Saqlash</button>
    <button class="btn light" onclick="showHomeInquiries(${h.id})">Bekor</button>`);
  setTimeout(()=>{
    document.getElementById('f_inquiry_name').value=q.name||'';
    document.getElementById('f_inquiry_phone').value=q.phone||'';
    document.getElementById('f_inquiry_status').value=q.status||'Yangi';
    document.getElementById('f_inquiry_note').value=q.note||'';
  },20);
}

async function updateHomeInquiry(id,homeId){
  const row={
    name:val('inquiry_name'),
    phone:val('inquiry_phone'),
    status:val('inquiry_status')||'Yangi',
    note:val('inquiry_note')
  };
  if(!row.name||!row.phone){alert('Mijoz ismi va telefonini kiriting.');return;}
  const {data,error}=await client.from('home_inquiries').update(row).eq('id',id).select().single();
  if(error)return alert('Tahrirlashda xatolik: '+error.message);
  const idx=db.inquiries.findIndex(x=>Number(x.id)===Number(id));
  if(idx>=0)db.inquiries[idx]=data;
  closeModal();
  render('homes');
}

async function deleteHomeInquiry(id){
  if(!confirm('Bu murojaatni o‘chirishni tasdiqlaysizmi?'))return;
  const {error}=await client.from('home_inquiries').delete().eq('id',id);
  if(error)return alert('O‘chirishda xatolik: '+error.message);
  db.inquiries=db.inquiries.filter(x=>Number(x.id)!==Number(id));
  closeModal();
  render('homes');
}

function openSellerContractChooser(sellerId){
  const seller=db.sellers.find(s=>Number(s.id)===Number(sellerId));
  if(!seller)return;

  const linkedHomes=db.homes.filter(h=>
    String(h.seller||'').trim().toLowerCase()===String(seller.name||'').trim().toLowerCase() ||
    (seller.phone && h.phone && String(h.phone).replace(/\D/g,'')===String(seller.phone).replace(/\D/g,''))
  );

  if(!linkedHomes.length){
    alert('Bu sotuvchiga biriktirilgan uy topilmadi.');
    return;
  }

  // Agar sotuvchida faqat bitta uy bo‘lsa, tanlash oynasini ko‘rsatmaymiz.
  // To‘g‘ridan-to‘g‘ri sotish shartnomasini ochamiz.
  if(linkedHomes.length===1){
    openContractForSellerHome(linkedHomes[0].id);
    return;
  }

  // Bir nechta uy bo‘lsa, avval tanlaymiz.
  // Muhim: avval modal yopiladi, keyin yangi shartnoma modali ochiladi.
  const opts=linkedHomes.map(h=>
    `<button class="btn primary" style="width:100%;margin:6px 0;text-align:left"
      onclick="closeModal();setTimeout(()=>openContractForSellerHome(${h.id}),0)">
      🏠 ${esc(h.title)} — ${money(h.price)}
      <span class="muted"> • ${esc(h.city||'')} • ${h.rooms||0} xona • ${h.m2||0} m²</span>
    </button>`
  ).join('');

  modal(`<div class="modal-head"><b>📄 Sotish shartnomasi</b><button class="icon" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div style="margin-bottom:10px"><b>${esc(seller.name)}</b> uchun uy tanlang:</div>
      ${opts}
    </div>`);
}

async function addStaff(){
  if(!requirePage('staff'))return;
  const name=val('staff_name'),phone=val('staff_phone');
  const login=String(val('staff_login')||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
  const password=String(val('staff_password')||'');
  if(!name||!phone||!login||!password){alert('Ism, telefon, login va parolni kiriting.');return;}
  if(login.length<3){alert('Login kamida 3 ta belgidan iborat bo‘lsin.');return;}
  if(password.length<6){alert('Parol kamida 6 ta belgidan iborat bo‘lsin.');return;}
  if(currentRole()!=='Admin'){alert('Xodim akkauntini faqat Admin yaratadi.');return;}
  const {data:exists,error:existsErr}=await client.from('staff').select('id').eq('login',login).limit(1);
  if(existsErr)return alert('Loginni tekshirishda xatolik: '+existsErr.message);
  if(exists?.length){alert('Bu login band. Boshqa login tanlang.');return;}
  const {data:sessionData}=await client.auth.getSession();
  const adminSession=sessionData?.session||null;
  if(!adminSession){alert('Admin sessiyasi topilmadi. Qayta kiring.');return;}
  const managerVal=val('staff_manager');
  const payload={
    name,phone,login,password,
    role:val('staff_role')||'Agent',
    manager_id:managerVal?Number(managerVal):null,
    is_active:val('staff_active')!=='false'
  };
  try{
    const r=await fetch(SUPABASE_URL+'/functions/v1/create-staff',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+adminSession.access_token},
      body:JSON.stringify(payload)
    });
    const out=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(out.error||out.message||('HTTP '+r.status));
    if(!out.staff)throw new Error('Xodim bazaga qaytmadi.');
    db.staff.unshift(out.staff);closeModal();go('staff');
    alert('Xodim muvaffaqiyatli yaratildi. Endi u Login + Parol bilan kiradi.');
  }catch(e){
    console.error(e);
    alert('Xodim yaratishda xatolik: '+(e.message||e));
  }
}

async function saveStaff(id){
  if(!requirePage('staff'))return;

  const x=db.staff.find(a=>Number(a.id)===Number(id));if(!x)return;

  const managerVal=val('staff_manager');
  const row={name,phone,email:val('staff_email')||null,role:val('staff_role')||'Agent',manager_id:managerVal?Number(managerVal):null,is_active:val('staff_active')!=='false'};

  }

async function toggleStaff(id,active){
  if(!requirePage('staff'))return;
  if(currentRole()!=='Admin'){alert('Xodim holatini faqat Admin o‘zgartiradi.');return;}
  const x=db.staff.find(a=>Number(a.id)===Number(id));if(!x)return;
  if(String(x.role||'').toLowerCase()==='admin'){alert('Admin akkauntini o‘zgartirish mumkin emas.');return;}
  const newState=active===true||active==='true';
  const {data,error}=await client.from('staff').update({is_active:newState}).eq('id',id).select().single();
  if(error)return alert('Holatni o‘zgartirishda xatolik: '+error.message);
  Object.assign(x,data);render('staff');
}
async function deleteStaff(id){
  if(!requirePage('staff'))return;
  if(currentRole()!=='Admin'){alert('Xodimni faqat Admin o‘chira oladi.');return;}
  const x=db.staff.find(a=>Number(a.id)===Number(id));if(!x)return;
  if(String(x.role||'').toLowerCase()==='admin'){alert('Admin akkauntini o‘chirish mumkin emas.');return;}
  if(!confirm(`${x.name} xodimini o‘chirishni tasdiqlaysizmi?`))return;
  const {error}=await client.from('staff').delete().eq('id',id);
  if(error)return alert('O‘chirishda xatolik: '+error.message);
  db.staff=db.staff.filter(a=>Number(a.id)!==Number(id));render('staff');
}

function encodeContractQRPayload(obj){
  try{
    return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
      .replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=+$/,'');
  }catch(e){return '';}
}
function decodeContractQRPayload(token){
  try{
    const s=String(token||'').replace(/-/g,'+').replace(/_/g,'/');
    const padded=s+'='.repeat((4-s.length%4)%4);
    return JSON.parse(decodeURIComponent(escape(atob(padded))));
  }catch(e){return null;}
}
function makeContractQR(payload){
  const token=encodeContractQRPayload(payload);
  const url=new URL(window.location.href);
  url.searchParams.delete('admin');
  url.searchParams.delete('form');
  url.hash='contractqr='+encodeURIComponent(token);
  const data=encodeURIComponent(url.toString());
  return 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=4&data='+data;
}

function crmMeta(note,key){
  const m=String(note||'').match(new RegExp('\\['+key+'\\]([\\s\\S]*?)\\[\\/'+key+'\\]'));
  if(!m)return {};
  const out={};
  m[1].split(/\r?\n/).forEach(line=>{
    const i=line.indexOf('=');
    if(i>0)out[line.slice(0,i).trim()]=line.slice(i+1).trim();
  });
  return out;
}
function visibleNote(note){
  return String(note||'')
    .replace(/\[CRM_HOME\][\s\S]*?\[\/CRM_HOME\]/g,'')
    .replace(/\[CRM_BUYER\][\s\S]*?\[\/CRM_BUYER\]/g,'')
    .replace(/\[PROPERTY_IMAGES\][\s\S]*?\[\/PROPERTY_IMAGES\]/g,'')
    .replace(/\[CRM_OWNER\][\s\S]*?\[\/CRM_OWNER\]/g,'')
    .replace(/\[CRM_SELLER_OWNER\][\s\S]*?\[\/CRM_SELLER_OWNER\]/g,'')
    .trim();
}
function buyerReq(b){
  const m=crmMeta(b.note,'CRM_BUYER');
  const rmin=Number(m.rooms_min||b.rooms||0), rmax=Number(m.rooms_max||b.rooms||0);
  const fmin=m.floor_min===''||m.floor_min===undefined?0:Number(m.floor_min||0);
  const fmax=m.floor_max===''||m.floor_max===undefined?0:Number(m.floor_max||0);
  return {rmin:rmin||0,rmax:rmax||rmin||0,fmin,fmax};
}
function homeFloor(h){
  const m=crmMeta(h.note,'CRM_HOME');
  return Number(m.floor||0);
}
function allBuyersForMatching(){
  const out=[...db.buyers];
  const phones=new Set(out.map(b=>String(b.phone||'')));
  (db.inquiries||[]).forEach(q=>{
    const phone=String(q.phone||'');
    if(!phone||phones.has(phone))return;
    const h=db.homes.find(x=>Number(x.id)===Number(q.home_id));
    out.push({
      id:'inq_'+q.id,name:q.name,phone:q.phone,
      city:h?.city||'',area:h?.area||'',
      rooms:Number(h?.rooms)||0,m2:Number(h?.m2)||0,budget:Number(h?.price)||0,
      finish:'',type:h?.type||'',note:q.note||'',["_inquiry"]:true,
      _floor:Number(h?.note?homeFloor(h):0)||0
    });
    phones.add(phone);
  });
  return out;
}
function findHomes(b){
  const req=buyerReq(b);
  return db.homes.filter(h=>{
    if(h.status==='Sotildi')return false;
    const priceOk=moneyCurrency(h.price)===moneyCurrency(b.budget)&&moneyAmount(h.price)<=moneyAmount(b.budget);
    const roomOk=Number(h.rooms)>=req.rmin&&Number(h.rooms)<=req.rmax;
    const hf=homeFloor(h);
    const floorOk=(!req.fmin&&!req.fmax)||(hf>=req.fmin&&(req.fmax?hf<=req.fmax:true));
    const typeOk=!b.type||b.type==='Farqi yo‘q'||b.type===h.type;
    const cityOk=!String(b.city||'').trim()||String(b.city||'').trim()===String(h.city||'').trim();
    return priceOk&&roomOk&&floorOk&&typeOk&&cityOk;
  });
}
function findBuyers(h){
  const hf=homeFloor(h);
  return allBuyersForMatching().filter(b=>{
    const req=buyerReq(b);
    const priceOk=moneyCurrency(b.budget)===moneyCurrency(h.price)&&moneyAmount(b.budget)>=moneyAmount(h.price);
    const roomOk=Number(h.rooms)>=req.rmin&&Number(h.rooms)<=req.rmax;
    const floorOk=(!req.fmin&&!req.fmax)||(hf>=req.fmin&&(req.fmax?hf<=req.fmax:true));
    const typeOk=!b.type||b.type==='Farqi yo‘q'||b.type===h.type;
    const cityOk=!String(b.city||'').trim()||String(b.city||'').trim()===String(h.city||'').trim();
    return priceOk&&roomOk&&floorOk&&typeOk&&cityOk;
  });
}

async function del(type,id){

  }
  if(!confirm('O‘chirishni tasdiqlaysizmi?'))return;
  const {error}=await client.from(type).delete().eq('id',id);
  if(error)return alert('O‘chirishda xatolik: '+error.message);

}

function filterAllHomes(){
  const q=String(document.getElementById('allHomesSearch')?.value||'').toLowerCase().trim();
  const city=String(document.getElementById('allHomesCity')?.value||'');
  const type=String(document.getElementById('allHomesType')?.value||'');
  const rooms=String(document.getElementById('allHomesRooms')?.value||'');
  const sort=String(document.getElementById('allHomesSort')?.value||'new');
  const params=new URLSearchParams(window.location.search);
  const priceLimit=Number(params.get('price')||0);

  let a=publicHomesDb.filter(x=>{
    if(q && !`${x.title} ${x.city} ${x.area} ${x.price} ${x.rooms} ${x.m2} ${x.finish}`.toLowerCase().includes(q))return false;
    if(city && String(x.city||'')!==city)return false;
    if(type && String(x.type||'')!==type)return false;
    if(rooms){
      const r=Number(x.rooms||0);
      if(rooms==='5'){if(r<5)return false;}
      else if(r!==Number(rooms))return false;
    }
    if(priceLimit && moneyCurrency(x.price)!=='USD' && moneyAmount(x.price)>priceLimit*1000000)return false;
    return true;
  });
  if(sort==='low')a.sort((x,y)=>moneyAmount(x.price)-moneyAmount(y.price));
  if(sort==='high')a.sort((x,y)=>moneyAmount(y.price)-moneyAmount(x.price));
  const count=document.getElementById('allHomesCount');
  if(count)count.textContent=`${a.length} ta uy topildi`;
  const box=document.getElementById('allHomesList');
  if(box)box.innerHTML=publicHomeCards(a);
}



function setupPublicNavHover(){
  const nav=document.querySelector('.public-main-nav');
  if(!nav)return;
  const links=Array.from(nav.querySelectorAll(':scope > a'));
  const homesLink=links.find(a=>a.textContent.trim()==='Uylar');
  const servicesLink=links.find(a=>a.textContent.trim()==='Xizmatlar');
  const contactsLink=links.find(a=>a.textContent.trim()==='Kontaktlar');

  const positionHomesPopover=()=>{
    const pop=document.getElementById('homesPopover');
    if(!homesLink||!pop)return;
    const r=homesLink.getBoundingClientRect();
    const wasHidden=!pop.classList.contains('show');
    if(wasHidden)pop.classList.add('show');
    const w=pop.offsetWidth||235;
    const gap=9;
    const center=r.left+(r.width/2);
    const minLeft=w/2+8;
    const maxLeft=window.innerWidth-w/2-8;
    const left=Math.max(minLeft,Math.min(center,maxLeft));
    pop.style.position='fixed';
    pop.style.left=left+'px';
    pop.style.right='auto';
    pop.style.top=(r.bottom+gap)+'px';
    pop.style.transform='translateX(-50%)';
  };

  const bind=(link,id,keep)=>{
    if(!link)return;
    link.addEventListener('mouseenter',()=>{
      closeNavPopovers(keep);
      const pop=document.getElementById(id);
      if(pop)pop.classList.add('show');
      if(id==='homesPopover')positionHomesPopover();
    });
  };
  bind(homesLink,'homesPopover','homes');
  bind(servicesLink,'servicesPopover','services');
  bind(contactsLink,'contactPopover','contact');

  ['homesPopover','servicesPopover','contactPopover'].forEach(id=>{
    const pop=document.getElementById(id);
    if(!pop)return;
    pop.addEventListener('mouseenter',()=>{
      pop.classList.add('show');
    });
    pop.addEventListener('mouseleave',()=>{
      pop.classList.remove('show');
    });
  });

  nav.addEventListener('mouseleave',e=>{
    if(!e.relatedTarget || !e.relatedTarget.closest('.public-nav-popover')) {
      setTimeout(()=>{
        if(!document.querySelector('.public-nav-popover:hover'))
          closeNavPopovers();
      },80);
    }
  });
}

window.addEventListener('resize',()=>{
  const p=document.getElementById('homesPopover');
  if(p?.classList.contains('show')){
    const link=Array.from(document.querySelectorAll('.public-main-nav > a')).find(a=>a.textContent.trim()==='Uylar');
    if(link){
      const r=link.getBoundingClientRect();
      const w=p.offsetWidth||235;
      const left=Math.max(w/2+8,Math.min(r.left+r.width/2,window.innerWidth-w/2-8));
      p.style.position='fixed';
      p.style.left=left+'px';
      p.style.right='auto';
      p.style.top=(r.bottom+9)+'px';
      p.style.transform='translateX(-50%)';
    }
  }
});

function pf(id){
  return document.getElementById('pf_'+id)?.value.trim()||'';
}


function previewPropertyImages(event){
  const files=[...(event.target.files||[])];
  const box=document.getElementById('pf_image_preview');
  box.innerHTML='';
  files.slice(0,10).forEach(file=>{
    const url=URL.createObjectURL(file);
    const img=document.createElement('img');
    img.src=url;
    img.onload=()=>URL.revokeObjectURL(url);
    box.appendChild(img);
  });
  if(files.length>10){
    alert('Ko‘pi bilan 10 ta rasm tanlang.');
    event.target.value='';
    box.innerHTML='';
  }
}

async function uploadPropertyImages(files, title){
  const urls=[];
  const safeTitle=(title||'uy').toString().toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'uy';
  for(let i=0;i<files.length;i++){
    const file=files[i];
    if(!file.type.startsWith('image/')) throw new Error('Faqat rasm fayllarini yuklang.');
    if(file.size>50*1024*1024) throw new Error('Har bir rasm 50 MB dan katta bo‘lmasin.');
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path=`${Date.now()}-${safeTitle}-${i+1}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const up=await client.storage.from('property-images').upload(path,file,{upsert:false,contentType:file.type});
    if(up.error) throw up.error;
    const pub=client.storage.from('property-images').getPublicUrl(path);
    urls.push(pub.data.publicUrl);
  }
  return urls;
}

let publicSellSubmitting=false;

function normalizePhoneForCRM(v){
  return String(v||'').replace(/\D/g,'');
}

async function submitPublicSell(){
  if(publicSellSubmitting)return;

  const name=pf('seller_name'), phone=pf('seller_phone'), title=pf('title');
  const required=[name,phone,title,pf('city'),pf('area'),pf('rooms'),pf('m2'),pf('price'),pf('finish'),pf('type')];
  if(required.some(v=>!v)){alert('Iltimos, barcha majburiy maydonlarni to‘ldiring.');return;}

  const imageInput=document.getElementById('pf_images');
  const files=[...(imageInput?.files||[])];
  if(files.length>10){alert('Ko‘pi bilan 10 ta rasm yuborish mumkin.');return;}

  const submit=document.querySelector('#publicForm button.public-submit:not(.back)');
  publicSellSubmitting=true;
  const submitStartedAt=Date.now();
  if(submit){
    submit.disabled=true;
    submit.textContent='⏳ Yuborilmoqda...';
    submit.style.opacity='.7';
    submit.style.pointerEvents='none';
  }

  let createdSellerId=null;

  try{
    // Bir telefon raqami = bitta sotuvchi. Mavjud bo‘lsa, yangi dublikat yaratmaymiz.
    const phoneDigits=normalizePhoneForCRM(phone);
    let existingSeller=null;
    if(phoneDigits){
      const sellersRes=await client.from('sellers').select('*').limit(1000);
      if(sellersRes.error)throw sellersRes.error;
      existingSeller=(sellersRes.data||[]).find(s=>normalizePhoneForCRM(s.phone)===phoneDigits)||null;
    }

    if(!existingSeller){
      const sellerRow={name,phone,note:'Instagram ariza'};
      const sellerRes=await client.from('sellers').insert(sellerRow).select().single();
      if(sellerRes.error) throw sellerRes.error;
      createdSellerId=sellerRes.data?.id||null;
    }

    let imageUrls=[];
    if(files.length) imageUrls=await uploadPropertyImages(files,title);

    let note=pf('note');
    if(imageUrls.length){
      note=(note?note+'\n\n':'')+'[PROPERTY_IMAGES]\n'+imageUrls.join('\n')+'\n[/PROPERTY_IMAGES]';
    }

    const homeRow={
      title,
      city:pf('city'),
      area:pf('area'),
      rooms:Number(pf('rooms'))||0,
      m2:Number(pf('m2'))||0,
      price:parseMoneyInput(pf('price'))||0,
      finish:pf('finish'),
      type:pf('type'),
      seller:name,
      phone,
      status:'Faol',
      note:(note?note+'\n\n':'')+'[CRM_HOME]\nfloor='+Math.max(0,Number(pf('floor')||0))+'\n[/CRM_HOME]'
    };
    const homeRes=await client.from('homes').insert(homeRow).select().single();
    if(homeRes.error) throw homeRes.error;

    const elapsed=Date.now()-submitStartedAt;
    if(elapsed<800) await new Promise(r=>setTimeout(r,800-elapsed));

    if(submit){
      submit.textContent='✅ Yuborildi';
      submit.disabled=true;
      submit.style.opacity='1';
      submit.style.pointerEvents='none';
    }
    await new Promise(r=>setTimeout(r,600));

    publicSuccess(imageUrls.length
      ? `Uy ma’lumotlari va ${imageUrls.length} ta rasm qabul qilindi.`
      : 'Uy ma’lumotlaringiz qabul qilindi. Tez orada siz bilan bog‘lanamiz.'
    );
  }catch(err){
    // Agar yangi sotuvchi yaratilib, uy saqlanmagan bo‘lsa, yetim sotuvchini o‘chiramiz.
    if(createdSellerId){
      try{ await client.from('sellers').delete().eq('id',createdSellerId); }catch(e){}
    }
    publicSellSubmitting=false;
    alert('Saqlashda xatolik: '+(err.message||err));
    if(submit){
      submit.disabled=false;
      submit.textContent='Yuborish';
      submit.style.opacity='';
      submit.style.pointerEvents='';
    }
  }
}

let publicBuySubmitting=false;

async function submitPublicBuy(){
  if(publicBuySubmitting)return;

  const name=pf('name'), phone=pf('phone');
  const required=[name,phone,pf('city'),pf('area'),pf('rooms'),pf('m2'),pf('budget'),pf('finish'),pf('type')];
  if(required.some(v=>!v)){alert('Iltimos, barcha majburiy maydonlarni to‘ldiring.');return;}
  const floorMin=Math.max(0,Number(pf('floor_min')||0));
  const floorMax=Math.max(0,Number(pf('floor_max')||0));
  if(floorMin && floorMax && floorMax<floorMin){alert('Qavat minimum va maksimumini to‘g‘ri kiriting.');return;}

  const submit=document.querySelector('#publicForm button.public-submit:not(.back)');
  publicBuySubmitting=true;
  const submitStartedAt=Date.now();
  if(submit){
    submit.disabled=true;
    submit.textContent='⏳ Yuborilmoqda...';
    submit.style.opacity='.7';
    submit.style.pointerEvents='none';
  }

  const row={
    name,
    phone,
    city:pf('city'),
    area:pf('area'),
    rooms:Number(pf('rooms'))||0,
    m2:Number(pf('m2'))||0,
    budget:parseMoneyInput(pf('budget'))||0,
    finish:pf('finish'),
    type:pf('type'),
    note:(pf('note')?pf('note')+'\n\n':'')+'[CRM_BUYER]\nrooms_min='+Number(pf('rooms')||0)+'\nrooms_max='+Number(pf('rooms')||0)+'\nfloor_min='+Math.max(0,Number(pf('floor_min')||0))+'\nfloor_max='+Math.max(0,Number(pf('floor_max')||0))+'\n[/CRM_BUYER]'
  };

  try{
    const res=await client.from('buyers').insert(row);
    if(res.error)throw res.error;

    // Foydalanuvchi yuborilayotganini aniq ko‘rishi uchun kamida 800 ms ko‘rsatamiz.
    const elapsed=Date.now()-submitStartedAt;
    if(elapsed<800) await new Promise(r=>setTimeout(r,800-elapsed));

    if(submit){submit.textContent='✅ Yuborildi';submit.disabled=true;submit.style.opacity='1';}
    await new Promise(r=>setTimeout(r,600));
    publicSuccess('Mijoz ma’lumotlari muvaffaqiyatli yuborildi.');
  }catch(err){
    publicBuySubmitting=false;
    if(submit){submit.disabled=false;submit.textContent='Yuborish';submit.style.opacity='';submit.style.pointerEvents='';}
    alert('Saqlashda xatolik: '+(err.message||err));
  }
}

function publicSuccess(message){
  const form=document.getElementById('publicForm');
  const s=document.getElementById('publicSuccess');
  if(form && s){
    // Natijani aynan forma tugmasining tagiga chiqaramiz:
    // footer/social bloklaridan keyin emas.
    form.insertAdjacentElement('afterend',s);
    form.style.display='none';
  }
  s.className='public-success show';
  s.innerHTML=`<div style="font-size:50px">✅</div><h2>Qabul qilindi</h2><p>${esc(message)}</p><button class="public-submit" onclick="publicHome()">Bosh sahifaga qaytish</button>`;
}

    prompt('Linkni nusxalang:',link);
  }
}

function openInstagramService(type){
  const url=new URL(window.location.href);

  // Shunda forma ichidagi "← Orqaga" yana 2 ta tanlovga qaytaradi.
  url.searchParams.set('instagram','1');
  url.searchParams.delete('form');
  url.searchParams.delete('homes');
  url.searchParams.delete('admin');
  url.searchParams.set('service',type);
  window.location.href=url.toString();
}

  document.body.style.overflow='auto';

  const head=site.querySelector('.public-site-head');
  const box=document.getElementById('publicForm');

  site.querySelectorAll(':scope > *').forEach(el=>{
    if(el===head || el===box || el.id==='publicSuccess') return;
    el.style.setProperty('display','none','important');
    el.style.setProperty('height','0','important');
    el.style.setProperty('min-height','0','important');
    el.style.setProperty('margin','0','important');
    el.style.setProperty('padding','0','important');
  });

  head.style.setProperty('position','fixed','important');
  head.style.setProperty('top','0','important');
  head.style.setProperty('left','0','important');
  head.style.setProperty('right','0','important');
  head.style.setProperty('z-index','100','important');

  head.insertAdjacentElement('afterend',box);
  box.className='public-form show';
  box.style.setProperty('display','block','important');
  box.style.setProperty('width','min(760px,calc(100% - 36px))','important');
  box.style.setProperty('margin','0 auto','important');
  box.style.setProperty('padding','105px 0 40px','important');
  box.style.setProperty('position','relative','important');
  box.style.setProperty('z-index','20','important');

      <h2 style="margin-bottom:8px">Xorazm Uy-Joy Platformasi</h2>

        <button class="public-choice-buy" style="width:100%;min-height:58px" onclick="openInstagramService('buy')">🔑 UY OLMOQCHIMAN</button>
        <button class="public-choice-buy" style="width:100%;min-height:58px" onclick="openInstagramService('sell')">🏠 UYIMNI SOTMOQCHIMAN</button>

function modal(x){document.getElementById('modalBox').innerHTML=x;document.getElementById('modal').style.display='flex'}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='f_contract_home')fillContractHome();});
function closeModal(){document.getElementById('modal').style.display='none'}
document.addEventListener('click',e=>{const n=e.target.closest?.('.nav[data-page]');if(n){e.preventDefault();go(n.dataset.page);}});

const params=new URLSearchParams(window.location.search);
const isPublicForm=params.get('form')==='1';
const isInstagram=params.get('instagram')==='1';
const isHomesPage=params.get('homes')==='1';
const isAdmin=params.get('admin')==='1';
const publicService=params.get('service');
const qrHash=String(window.location.hash||'');
const qrMatch=qrHash.match(/^#contractqr=(.+)$/);
const qrPayload=qrMatch?decodeContractQRPayload(decodeURIComponent(qrMatch[1])):null;

if(qrPayload){
  showPublicContractQR(qrPayload);
}else if(isHomesPage){
  publicHomesPage();
}else if(publicService==='sell' || publicService==='buy'){
  publicHome();
  setTimeout(()=>showPublicForm(publicService),50);
}else if(isInstagram){
  publicHome();
  setTimeout(()=>showInstagramChoice(),50);
}else if(isPublicForm){
  publicHome();
}else if(isAdmin){
  showLogin();
  client.auth.getSession().then(({data})=>{
    if(data.session) showCRM();
  });
  client.auth.onAuthStateChange((event,session)=>{
    if(session){ showCRM(); }
    else if(event==='SIGNED_OUT'){ showLogin(); }
  });
}else{
  publicHome();
}
