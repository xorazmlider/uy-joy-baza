<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Uy e’lonini yuborish</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #333;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      text-align: center;
    }

    .success {
      display: block !important;
      background: #e8f8ed;
      color: #137333;
    }

    .error {
      display: block !important;
      background: #fdeaea;
      color: #c5221f;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🏠 Uy e’lonini yuborish</h1>

    <div class="subtitle">
      Uy ma’lumotlarini to‘ldiring
    </div>

    <form id="homeForm">

      <label>Uy nomi</label>
      <input
        type="text"
        id="title"
        placeholder="Masalan: 3 xonali uy"
        required
      >

      <label>Shahar / tuman</label>
      <input
        type="text"
        id="city"
        placeholder="Masalan: Urganch"
        required
      >

      <label>Manzil</label>
      <input
        type="text"
        id="area"
        placeholder="Masalan: Al-Xorazmiy ko‘chasi"
      >

      <label>Xonalar soni</label>
      <input
        type="number"
        id="rooms"
        placeholder="Masalan: 3"
      >

      <label>Maydon (m²)</label>
      <input
        type="number"
        id="m2"
        placeholder="Masalan: 120"
        step="0.01"
      >

      <label>Narxi</label>
      <input
        type="number"
        id="price"
        placeholder="Masalan: 85000"
        step="0.01"
      >

      <label>Uy turi</label>
      <select id="type">
        <option value="">Tanlang</option>
        <option value="Hovli">Hovli</option>
        <option value="Kvartira">Kvartira</option>
        <option value="Dacha">Dacha</option>
        <option value="Yer">Yer</option>
        <option value="Boshqa">Boshqa</option>
      </select>

      <label>Remont holati</label>
      <select id="finish">
        <option value="">Tanlang</option>
        <option value="Remontli">Remontli</option>
        <option value="Remontsız">Remontsız</option>
        <option value="Yangi remont">Yangi remont</option>
        <option value="Qora suvoq">Qora suvoq</option>
        <option value="Ta’mir talab">Ta’mir talab</option>
      </select>

      <label>Sotuvchi ismi</label>
      <input
        type="text"
        id="seller"
        placeholder="Ism familiya"
        required
      >

      <label>Telefon raqam</label>
      <input
        type="tel"
        id="phone"
        placeholder="+998 90 123 45 67"
        required
      >

      <label>Holati</label>
      <select id="status">
        <option value="Yangi">Yangi</option>
[16.08.2026 22:00] Alisher Xudayberganov: <option value="Tekshirilmoqda">Tekshirilmoqda</option>
        <option value="Sotuvda">Sotuvda</option>
      </select>

      <label>Qo‘shimcha ma’lumot</label>
      <textarea
        id="note"
        placeholder="Uy haqida qo‘shimcha ma’lumot..."
      ></textarea>

      <button type="submit" id="submitBtn">
        E’LONNI YUBORISH
      </button>

      <div id="message"></div>

    </form>

  </div>

</div>


<script>

  // ==============================
  // SUPABASE SOZLAMALARI
  // ==============================

  const SUPABASE_URL =
    "https://rmelwwzaagyzdcrdpkva.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_itMmxW5YPm87O6tADGIEYw_xrs2xNe-";


  // ==============================
  // FORM
  // ==============================

  const form = document.getElementById("homeForm");

  const button = document.getElementById("submitBtn");

  const message = document.getElementById("message");


  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    button.disabled = true;

    button.textContent = "Yuborilmoqda...";

    message.className = "";
    message.style.display = "none";


    // Ma'lumotlarni olish

    const data = {

      title: document.getElementById("title").value.trim(),

      city: document.getElementById("city").value.trim(),

      area: document.getElementById("area").value.trim(),

      rooms: document.getElementById("rooms").value
        ? Number(document.getElementById("rooms").value)
        : null,

      m2: document.getElementById("m2").value
        ? Number(document.getElementById("m2").value)
        : null,

      price: document.getElementById("price").value
        ? Number(document.getElementById("price").value)
        : null,

      type: document.getElementById("type").value || null,

      finish: document.getElementById("finish").value || null,

      seller: document.getElementById("seller").value.trim(),

      phone: document.getElementById("phone").value.trim(),

      status: document.getElementById("status").value,

      note: document.getElementById("note").value.trim()

    };


    try {

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/homes",
        {

          method: "POST",

          headers: {

            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " + SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify(data)

        }
      );


      if (!response.ok) {

        const errorText = await response.text();

        throw new Error(errorText);

      }


      // Muvaffaqiyat

      message.textContent =
        "✅ E’lon muvaffaqiyatli yuborildi!";

      message.className = "success";


      form.reset();


    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ Xatolik yuz berdi. Qaytadan urinib ko‘ring.";

      message.className = "error";

    }


    button.disabled = false;

    button.textContent = "E’LONNI YUBORISH";

  });

</script>

</body>
</html>
