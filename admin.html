<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .login,
    .panel {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .login {
      max-width: 420px;
      margin: 60px auto;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-btn {
      width: 100%;
      background: #111;
      color: white;
    }

    .logout {
      background: #e53935;
      color: white;
      float: right;
    }

    .search {
      margin-top: 20px;
    }

    .home {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 18px;
      margin-top: 15px;
    }

    .home h3 {
      margin-top: 0;
    }

    .info {
      line-height: 1.7;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .status {
      background: #eee;
    }

    .delete {
      background: #e53935;
      color: white;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    @media(max-width:600px) {
      .container {
        padding: 10px;
      }

      .panel {
        padding: 15px;
      }
    }

    .inquiry-panel{
      margin-top:15px;
      padding:14px;
      background:#fff;
      border:1px solid #ddd;
      border-radius:12px;
    }
    .inquiry-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .inquiry-list{display:grid;gap:8px}
    .inquiry-item{
      padding:10px;
      border:1px solid #e5e7eb;
      border-radius:10px;
      background:#fafafa;
    }
    .inquiry-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .inquiry-btn{background:#2563eb;color:#fff}
    .inquiry-small{padding:8px 10px;font-size:13px}
    .inquiry-empty{color:#777;font-size:14px}
    .inquiry-form{
      margin-top:10px;
      padding:12px;
      border:1px solid #ddd;
      border-radius:10px;
      background:#f9fafb;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="loginBox" class="login">

    <h1>🔐 Admin</h1>

    <p style="text-align:center;color:#777;">
      Admin panelga kirish
    </p>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Parol"
    >

    <button
      class="login-btn"
      onclick="login()"
    >
      KIRISH
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- ADMIN PANEL -->

  <div id="adminPanel" class="panel hidden">

    <button
      class="logout"
      onclick="logout()"
    >
      Chiqish
    </button>

    <h1>🏠 Uylar bazasi</h1>

    <input
      class="search"
      type="text"
      id="search"
      placeholder="🔎 Ism, telefon, shahar yoki manzil bo‘yicha qidiring..."
      oninput="filterHomes()"
    >

    <div id="homesList"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://rmelwwzaagyzdcrdpkva.supabase.co";

const SUPABASE_KEY =
"sb_publishable_itMmxW5YPm87O6tADGIEYw_xrs2xNe-";

let accessToken = "";

let homes = [];
let inquiries = [];
function formatAdminPrice(value){
  const n=Number(value);
  if(!Number.isFinite(n)||n===0)return "-";
  if(n<0)return "$"+Math.round(Math.abs(n)).toLocaleString("en-US");
  if(n>=1e9)return (n/1e9).toFixed(2)+" mlrd so‘m";
  return Math.round(n/1e6)+" mln so‘m";
}



/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.textContent =
      "Email va parolni kiriting.";

    return;
  }

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {

        method: "POST",

        headers: {

          "apikey": SUPABASE_KEY,

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          email: email,

          password: password

        })

      }
    );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.msg ||
        data.error ||
        "Login xatosi"
      );

    }


    accessToken =
      data.access_token;


    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");


    loadHomes();


  } catch (error) {

    message.textContent =
      "❌ " + error.message;

  }

}


/* =========================
   HOMESNI OLISH
========================= */

async function loadHomes() {

  const list =
    document.getElementById("homesList");

  list.innerHTML =
    "<p>Yuklanmoqda...</p>";

  try {

    const [homesResponse, inquiriesResponse] = await Promise.all([
      fetch(
        SUPABASE_URL +
        "/rest/v1/homes?select=*&order=created_at.desc",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + accessToken
          }
        }
      ),
      fetch(
        SUPABASE_URL +
        "/rest/v1/home_inquiries?select=*&order=created_at.desc",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + accessToken
          }
        }
      )
    ]);

    if (!homesResponse.ok) {
      throw new Error(await homesResponse.text());
    }

    if (!inquiriesResponse.ok) {
      throw new Error(await inquiriesResponse.text());
    }

    homes = await homesResponse.json();
    inquiries = await inquiriesResponse.json();

    showHomes(homes);

  } catch (error) {

    list.innerHTML =
      "<p>❌ Ma'lumotlarni olishda xato.</p>";

    console.error(error);
  }
}


/* =========================
   HOMESNI KO‘RSATISH
========================= */

function showHomes(data) {

  const list =
    document.getElementById("homesList");


  if (!data.length) {

    list.innerHTML =
      "<p>Hozircha e'lonlar yo‘q.</p>";

    return;

  }


  list.innerHTML =
    data.map(home => `

      <div class="home">

        <h3>
          🏠 ${escapeHtml(home.title || "Nomsiz uy")}
        </h3>

        <div class="info">

          <b>📍 Shahar:</b>
          ${escapeHtml(home.city || "-")}
          <br>

          <b>📌 Manzil:</b>
          ${escapeHtml(home.area || "-")}
          <br>

          <b>🚪 Xonalar:</b>
          ${home.rooms ?? "-"}
          <br>

          <b>📐 Maydon:</b>
          ${home.m2 ?? "-"} m²
          <br>

          <b>💰 Narx:</b>
          ${formatAdminPrice(home.price)}
          <br>

          <b>🏠 Turi:</b>
          ${escapeHtml(home.type || "-")}
          <br>

          <b>🔨 Remont:</b>
          ${escapeHtml(home.finish || "-")}
          <br>

          <b>👤 Sotuvchi:</b>
          ${escapeHtml(home.seller || "-")}
          <br>

          <b>📞 Telefon:</b>
          ${escapeHtml(home.phone || "-")}
          <br>

          <b>📝 Izoh:</b>
          ${escapeHtml(home.note || "-")}
          <br>

          <b>📅 Sana:</b>
          ${home.created_at
            ? new Date(home.created_at).toLocaleString("uz-UZ")
            : "-"}

        </div>


        <div class="actions">

          <select
            class="status"
            onchange="changeStatus(${home.id}, this.value)"
          >

            <option
              value="Yangi"
              ${home.status === "Yangi" ? "selected" : ""}
            >
              Yangi
            </option>

            <option
              value="Tekshirilmoqda"
              ${home.status === "Tekshirilmoqda" ? "selected" : ""}
            >
              Tekshirilmoqda
            </option>

            <option
              value="Sotuvda"
              ${home.status === "Sotuvda" ? "selected" : ""}
            >
              Sotuvda
            </option>

            <option
              value="Sotilgan"
              ${home.status === "Sotilgan" ? "selected" : ""}
            >
              Sotilgan
            </option>

          </select>


          <button
            class="delete"
            onclick="deleteHome(${home.id})"
          >
            🗑 O‘chirish
          </button>

        </div>

      </div>

    `).join("");

}



function renderHomeInquiries(homeId) {

  const rows = inquiries
    .filter(q => Number(q.home_id) === Number(homeId));

  if (!rows.length) {
    return '<div class="inquiry-empty">Hali bu uyni so‘ragan mijoz yo‘q.</div>';
  }

  return rows.map(q => `
    <div class="inquiry-item">
      <b>👤 ${escapeHtml(q.name || "-")}</b><br>
      📞 ${escapeHtml(q.phone || "-")}<br>
      🔄 ${escapeHtml(q.status || "Yangi")}
      ${q.note ? `<br>📝 ${escapeHtml(q.note)}` : ""}
      ${q.created_at ? `<br><small>📅 ${new Date(q.created_at).toLocaleString("uz-UZ")}</small>` : ""}
      <div class="inquiry-actions">
        <a class="inquiry-small" href="tel:${escapeHtml(q.phone || "")}">📞 Qo‘ng‘iroq</a>
        <button class="inquiry-small" onclick="editInquiry(${q.id})">Tahrir</button>
        <button class="inquiry-small" onclick="deleteInquiry(${q.id}, ${homeId})">O‘chirish</button>
      </div>
    </div>
  `).join("");
}

function openInquiryForm(homeId) {

  const old = document.getElementById("inquiryForm");

  if (old) old.remove();

  const home = homes.find(h => Number(h.id) === Number(homeId));

  if (!home) return;

  const card = [...document.querySelectorAll(".home")]
    .find(el => el.querySelector(`button[onclick="openInquiryForm(${homeId})"]`));

  if (!card) return;

  const form = document.createElement("div");
  form.id = "inquiryForm";
  form.className = "inquiry-form";

  form.innerHTML = `
    <b>📞 ${escapeHtml(home.title || "Shu uy")} uchun mijoz</b>

    <input id="inqName" placeholder="Mijoz ismi">
    <input id="inqPhone" placeholder="Telefon raqami">

    <select id="inqStatus">
      <option value="Yangi">Yangi</option>
      <option value="Bog‘landim">Bog‘landim</option>
      <option value="Ko‘rishga keladi">Ko‘rishga keladi</option>
      <option value="O‘ylayapti">O‘ylayapti</option>
      <option value="Rad etdi">Rad etdi</option>
      <option value="Sotib oldi">Sotib oldi</option>
    </select>

    <input id="inqNote" placeholder="Izoh: nima so‘radi, qachon ko‘radi va hokazo">

    <button class="inquiry-btn" onclick="saveInquiry(${homeId})">💾 Saqlash</button>
    <button onclick="document.getElementById('inquiryForm')?.remove()">Bekor</button>
  `;

  card.appendChild(form);
  document.getElementById("inqName").focus();
}

async function saveInquiry(homeId) {

  const name = document.getElementById("inqName")?.value.trim();
  const phone = document.getElementById("inqPhone")?.value.trim();
  const status = document.getElementById("inqStatus")?.value || "Yangi";
  const note = document.getElementById("inqNote")?.value.trim() || "";

  if (!name || !phone) {
    alert("Mijoz ismi va telefon raqamini kiriting.");
    return;
  }

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/home_inquiries",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
          "Prefer": "return=representation"
        },
        body: JSON.stringify({
          home_id: homeId,
          name: name,
          phone: phone,
          status: status,
          note: note
        })
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const data = await response.json();

    inquiries.unshift(data[0]);

    showHomes(homes);

  } catch (error) {

    alert("❌ Mijozni saqlab bo‘lmadi.");
    console.error(error);
  }
}

async function editInquiry(id) {

  const q = inquiries.find(x => Number(x.id) === Number(id));

  if (!q) return;

  const name = prompt("Mijoz ismi:", q.name || "");
  if (name === null) return;

  const phone = prompt("Telefon raqami:", q.phone || "");
  if (phone === null) return;

  const note = prompt("Izoh:", q.note || "");
  if (note === null) return;

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/home_inquiries?id=eq." + id,
      {
        method: "PATCH",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
          "Prefer": "return=representation"
        },
        body: JSON.stringify({
          name,
          phone,
          note
        })
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const data = await response.json();

    const index = inquiries.findIndex(x => Number(x.id) === Number(id));

    if (index !== -1 && data[0]) {
      inquiries[index] = data[0];
    }

    showHomes(homes);

  } catch (error) {

    alert("❌ Mijozni tahrirlab bo‘lmadi.");
    console.error(error);
  }
}

async function deleteInquiry(id, homeId) {

  if (!confirm("Bu mijoz murojaatini o‘chirishga ishonchingiz komilmi?")) {
    return;
  }

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/home_inquiries?id=eq." + id,
      {
        method: "DELETE",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken
        }
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    inquiries =
      inquiries.filter(x => Number(x.id) !== Number(id));

    showHomes(homes);

  } catch (error) {

    alert("❌ Murojaatni o‘chirib bo‘lmadi.");
    console.error(error);
  }
}

/* =========================
   QIDIRUV
========================= */

function filterHomes() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    homes.filter(home => {

      const text = [

        home.title,

        home.city,

        home.area,

        home.seller,

        home.phone,

        home.type,

        home.status

      ]
      .filter(Boolean)
      .toLowerCase();


      return text.includes(search);

    });


  showHomes(filtered);

}


/* =========================
   STATUS O‘ZGARTIRISH
========================= */

async function changeStatus(id, status) {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/homes?id=eq." + id,
      {

        method: "PATCH",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + accessToken,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"

        },

        body: JSON.stringify({

          status: status

        })

      }
    );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    const home =
      homes.find(h => h.id === id);

    if (home) {

      home.status = status;

    }

  } catch (error) {

    alert(
      "❌ Statusni o‘zgartirib bo‘lmadi."
    );

    console.error(error);

  }

}


/* =========================
   O‘CHIRISH
========================= */

async function deleteHome(id) {

  const confirmDelete =
    confirm(
      "Bu e’lonni o‘chirishga ishonchingiz komilmi?"
    );


  if (!confirmDelete) return;


  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/homes?id=eq." + id,
      {

        method: "DELETE",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + accessToken

        }

      }
    );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    homes =
      homes.filter(
        home => home.id !== id
      );


    showHomes(homes);


  } catch (error) {

    alert(
      "❌ E’lonni o‘chirib bo‘lmadi."
    );

    console.error(error);

  }

}


/* =========================
   LOGOUT
========================= */

function logout() {

  accessToken = "";

  homes = [];
  inquiries = [];


  document
    .getElementById("adminPanel")
    .classList.add("hidden");


  document
    .getElementById("loginBox")
    .classList.remove("hidden");


  document
    .getElementById("password")
    .value = "";

}


/* =========================
   XAVFSIZ MATN
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
