/* =========================
   SHARTNOMA MODULI
========================= */
.contract-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;
  overflow:auto;padding:20px;
}
.contract-box{
  max-width:1000px;margin:auto;background:#fff;border-radius:16px;padding:20px;
}
.contract-form{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px;
}
.contract-form label{font-weight:bold;font-size:13px}
.contract-form input,.contract-form select,.contract-form textarea{
  width:100%;padding:10px;margin-top:5px;border:1px solid #ddd;border-radius:8px;
}
.contract-form textarea{min-height:70px}
.contract-buttons{margin-bottom:15px}
.contract-preview{
  background:#fff;border:1px solid #ddd;padding:28px;line-height:1.45;
  font-family:"Times New Roman",serif;font-size:14px;
}
.contract-preview h2{text-align:center;font-size:18px}
.contract-table{width:100%;border-collapse:collapse;margin:12px 0}
.contract-table th,.contract-table td{border:1px solid #222;padding:7px;vertical-align:top}
.contract-sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:25px}
.contract-pagebreak{page-break-before:always}
@media(max-width:600px){
  .contract-form,.contract-sign{grid-template-columns:1fr}
  .contract-modal{padding:8px}.contract-box{padding:12px}.contract-preview{padding:14px;font-size:13px}
}
@media print{
  body *{visibility:hidden!important}
  #contractModal,#contractModal *{visibility:visible!important}
  #contractModal{position:static;background:#fff;padding:0}
  .contract-box{max-width:none;padding:0}
  .contract-form,.contract-buttons,.contract-close{display:none!important}
  .contract-preview{border:0;padding:10mm}
}

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="loginBox" class="login">

    <h1>🔐 Admin</h1>

    <p style="text-align:center;color:#777;">
      Admin panelga kirish
    </p>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Parol"

      class="login-btn"
      onclick="login()"
    >
      KIRISH
    </button>

  <!-- ADMIN PANEL -->

    <input

      id="search"

    >

    <div id="homesList"></div>

</div>


<script>

const SUPABASE_URL =
"https://rmelwwzaagyzdcrdpkva.supabase.co";

const SUPABASE_KEY =
"sb_publishable_itMmxW5YPm87O6tADGIEYw_xrs2xNe-";

let accessToken = "";

let homes = [];
let inquiries = [];
function formatAdminPrice(value){
  const n=Number(value);
  if(!Number.isFinite(n)||n===0)return "-";
  if(n<0)return "$"+Math.round(Math.abs(n)).toLocaleString("en-US");
  if(n>=1e9)return (n/1e9).toFixed(2)+" mlrd so‘m";
  return Math.round(n/1e6)+" mln so‘m";
}



/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.textContent =
      "Email va parolni kiriting.";

    return;
  }

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {

        method: "POST",

        headers: {

          "apikey": SUPABASE_KEY,

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          email: email,

          password: password

        })

      }
    );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.msg ||
        data.error ||
        "Login xatosi"
      );

    }


    accessToken =
      data.access_token;


    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");


    loadHomes();


  } catch (error) {

    message.textContent =
      "❌ " + error.message;

  }

}


/* =========================
   HOMESNI OLISH
========================= */

async function loadHomes() {

  const list =
    document.getElementById("homesList");

  list.innerHTML =
    "<p>Yuklanmoqda...</p>";

  try {

    const [homesResponse, inquiriesResponse] = await Promise.all([
      fetch(
        SUPABASE_URL +
        "/rest/v1/homes?select=*&order=created_at.desc",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + accessToken
          }
        }
      ),
      fetch(
        SUPABASE_URL +
        "/rest/v1/home_inquiries?select=*&order=created_at.desc",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + accessToken
          }
        }
      )
    ]);

    if (!homesResponse.ok) {
      throw new Error(await homesResponse.text());
    }

    if (!inquiriesResponse.ok) {
      throw new Error(await inquiriesResponse.text());
    }

    homes = await homesResponse.json();
    inquiries = await inquiriesResponse.json();

    showHomes(homes);

  } catch (error) {

    list.innerHTML =
      "<p>❌ Ma'lumotlarni olishda xato.</p>";

    console.error(error);
  }
}


/* =========================
   HOMESNI KO‘RSATISH
========================= */

function showHomes(data) {

  const list =
    document.getElementById("homesList");


  if (!data.length) {

    list.innerHTML =
      "<p>Hozircha e'lonlar yo‘q.</p>";

    return;

  }


  list.innerHTML =
    data.map(home => `

      <div class="home">

        <h3>
          🏠 ${escapeHtml(home.title || "Nomsiz uy")}
        </h3>

        <div class="info">

          <b>📍 Shahar:</b>
          ${escapeHtml(home.city || "-")}
          <br>

          <b>📌 Manzil:</b>
          ${escapeHtml(home.area || "-")}
          <br>

          <b>🚪 Xonalar:</b>
          ${home.rooms ?? "-"}
          <br>

          <b>📐 Maydon:</b>
          ${home.m2 ?? "-"} m²
          <br>

          <b>💰 Narx:</b>
          ${formatAdminPrice(home.price)}
          <br>

          <b>🏠 Turi:</b>
          ${escapeHtml(home.type || "-")}
          <br>

          <b>🔨 Remont:</b>
          ${escapeHtml(home.finish || "-")}
          <br>

          <b>👤 Sotuvchi:</b>
          ${escapeHtml(home.seller || "-")}
          <br>

          <b>📞 Telefon:</b>
          ${escapeHtml(home.phone || "-")}
          <br>

          <b>📝 Izoh:</b>
          ${escapeHtml(home.note || "-")}
          <br>

          <b>📅 Sana:</b>
          ${home.created_at
            ? new Date(home.created_at).toLocaleString("uz-UZ")
            : "-"}

        </div>


        <div class="actions">

          <select
            class="status"
            onchange="changeStatus(${home.id}, this.value)"
          >

            <option
              value="Yangi"
              ${home.status === "Yangi" ? "selected" : ""}
            >
              Yangi
            </option>

            <option
              value="Tekshirilmoqda"
              ${home.status === "Tekshirilmoqda" ? "selected" : ""}
            >
              Tekshirilmoqda
            </option>

            <option
              value="Sotuvda"
              ${home.status === "Sotuvda" ? "selected" : ""}
            >
              Sotuvda
            </option>

            <option
              value="Sotilgan"
              ${home.status === "Sotilgan" ? "selected" : ""}
            >
              Sotilgan
            </option>

          </select>


          <button
            style="background:#111;color:#fff"
            onclick="openContractForHome(${home.id}, 'sell')"
          >
            📄 Shartnoma
          </button>

          <button
            style="background:#2563eb;color:#fff"
            onclick="openContractForHome(${home.id}, 'buy')"
          >
            🏠 Olib berish
          </button>

          <button
            class="delete"
            onclick="deleteHome(${home.id})"
          >
            🗑 O‘chirish
          </button>

        </div>

      </div>

    `).join("");

}



function renderHomeInquiries(homeId) {

  const rows = inquiries
    .filter(q => Number(q.home_id) === Number(homeId));

  if (!rows.length) {
    return '<div class="inquiry-empty">Hali bu uyni so‘ragan mijoz yo‘q.</div>';
  }

  return rows.map(q => `
    <div class="inquiry-item">
      <b>👤 ${escapeHtml(q.name || "-")}</b><br>
      📞 ${escapeHtml(q.phone || "-")}<br>
      🔄 ${escapeHtml(q.status || "Yangi")}
      ${q.note ? `<br>📝 ${escapeHtml(q.note)}` : ""}
      ${q.created_at ? `<br><small>📅 ${new Date(q.created_at).toLocaleString("uz-UZ")}</small>` : ""}
      <div class="inquiry-actions">
        <a class="inquiry-small" href="tel:${escapeHtml(q.phone || "")}">📞 Qo‘ng‘iroq</a>
        <button class="inquiry-small" onclick="editInquiry(${q.id})">Tahrir</button>
        <button class="inquiry-small" onclick="deleteInquiry(${q.id}, ${homeId})">O‘chirish</button>
      </div>
    </div>
  `).join("");
}

function openInquiryForm(homeId) {

  const old = document.getElementById("inquiryForm");

  if (old) old.remove();

  const home = homes.find(h => Number(h.id) === Number(homeId));

  if (!home) return;

  const card = [...document.querySelectorAll(".home")]
    .find(el => el.querySelector(`button[onclick="openInquiryForm(${homeId})"]`));

  if (!card) return;

  const form = document.createElement("div");
  form.id = "inquiryForm";
  form.className = "inquiry-form";

  form.innerHTML = `
    <b>📞 ${escapeHtml(home.title || "Shu uy")} uchun mijoz</b>

    <input id="inqName" placeholder="Mijoz ismi">
    <input id="inqPhone" placeholder="Telefon raqami">

    <select id="inqStatus">
      <option value="Yangi">Yangi</option>
      <option value="Bog‘landim">Bog‘landim</option>
      <option value="Ko‘rishga keladi">Ko‘rishga keladi</option>
      <option value="O‘ylayapti">O‘ylayapti</option>
      <option value="Rad etdi">Rad etdi</option>
      <option value="Sotib oldi">Sotib oldi</option>
    </select>

    <input id="inqNote" placeholder="Izoh: nima so‘radi, qachon ko‘radi va hokazo">

    <button class="inquiry-btn" onclick="saveInquiry(${homeId})">💾 Saqlash</button>
    <button onclick="document.getElementById('inquiryForm')?.remove()">Bekor</button>
  `;

  card.appendChild(form);
  document.getElementById("inqName").focus();
}

async function saveInquiry(homeId) {

  const name = document.getElementById("inqName")?.value.trim();
  const phone = document.getElementById("inqPhone")?.value.trim();
  const status = document.getElementById("inqStatus")?.value || "Yangi";
  const note = document.getElementById("inqNote")?.value.trim() || "";

  if (!name || !phone) {
    alert("Mijoz ismi va telefon raqamini kiriting.");
    return;
  }

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/home_inquiries",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
          "Prefer": "return=representation"
        },
        body: JSON.stringify({
          home_id: homeId,
          name: name,
          phone: phone,
          status: status,
          note: note
        })
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const data = await response.json();

    inquiries.unshift(data[0]);

    showHomes(homes);

  } catch (error) {

    alert("❌ Mijozni saqlab bo‘lmadi.");
    console.error(error);
  }
}

async function editInquiry(id) {

  const q = inquiries.find(x => Number(x.id) === Number(id));

  if (!q) return;

  const name = prompt("Mijoz ismi:", q.name || "");
  if (name === null) return;

  const phone = prompt("Telefon raqami:", q.phone || "");
  if (phone === null) return;

  const note = prompt("Izoh:", q.note || "");
  if (note === null) return;

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/home_inquiries?id=eq." + id,
      {
        method: "PATCH",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
          "Prefer": "return=representation"
        },
        body: JSON.stringify({
          name,
          phone,
          note
        })
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const data = await response.json();

    const index = inquiries.findIndex(x => Number(x.id) === Number(id));

    if (index !== -1 && data[0]) {
      inquiries[index] = data[0];
    }

    showHomes(homes);

  } catch (error) {

    alert("❌ Mijozni tahrirlab bo‘lmadi.");
    console.error(error);
  }
}

async function deleteInquiry(id, homeId) {

  if (!confirm("Bu mijoz murojaatini o‘chirishga ishonchingiz komilmi?")) {
    return;
  }

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/home_inquiries?id=eq." + id,
      {
        method: "DELETE",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken
        }
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    inquiries =
      inquiries.filter(x => Number(x.id) !== Number(id));

    showHomes(homes);

  } catch (error) {

    alert("❌ Murojaatni o‘chirib bo‘lmadi.");
    console.error(error);
  }
}

/* =========================
   QIDIRUV
========================= */

function filterHomes() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    homes.filter(home => {

      const text = [

        home.title,

        home.city,

        home.area,

        home.seller,

        home.phone,

        home.type,

        home.status

      ]
      .filter(Boolean)
      .toLowerCase();


      return text.includes(search);

    });


  showHomes(filtered);

}


/* =========================
   STATUS O‘ZGARTIRISH
========================= */

async function changeStatus(id, status) {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/homes?id=eq." + id,
      {

        method: "PATCH",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + accessToken,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"

        },

        body: JSON.stringify({

          status: status

        })

      }
    );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    const home =
      homes.find(h => h.id === id);

    if (home) {

      home.status = status;

    }

  } catch (error) {

    alert(
      "❌ Statusni o‘zgartirib bo‘lmadi."
    );

    console.error(error);

  }

}


/* =========================
   O‘CHIRISH
========================= */

async function deleteHome(id) {

  const confirmDelete =
    confirm(
      "Bu e’lonni o‘chirishga ishonchingiz komilmi?"
    );


  if (!confirmDelete) return;


  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/homes?id=eq." + id,
      {

        method: "DELETE",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + accessToken

        }

      }
    );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    homes =
      homes.filter(
        home => home.id !== id
      );


    showHomes(homes);


  } catch (error) {

    alert(
      "❌ E’lonni o‘chirib bo‘lmadi."
    );

    console.error(error);

  }

}


/* =========================
   LOGOUT
========================= */

function logout() {

  accessToken = "";

  homes = [];
  inquiries = [];


  document
    .getElementById("adminPanel")
    .classList.add("hidden");


  document
    .getElementById("loginBox")
    .classList.remove("hidden");


  document
    .getElementById("password")
    .value = "";

}


/* =========================
   XAVFSIZ MATN
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   SHARTNOMA
========================= */
function contractEsc(v){
  return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function cval(id){ return document.getElementById(id)?.value || ""; }

function openContractForHome(homeId, type="sell"){
  const home = homes.find(h => Number(h.id) === Number(homeId));
  if(!home) return;

  document.getElementById("contractModal").classList.remove("hidden");
  document.getElementById("contractType").value = type;
  document.getElementById("contractNum").value = "";
  document.getElementById("contractDate").value = new Date().toISOString().slice(0,10);

  document.getElementById("contractClient").value = type === "sell"
    ? (home.seller || "")
    : "";
  document.getElementById("contractPhone").value = type === "sell"
    ? (home.phone || "")
    : "";

  document.getElementById("contractAddress").value =
    [home.city, home.area].filter(Boolean).join(", ");
  document.getElementById("contractHouse").value = home.title || "";
  document.getElementById("contractRooms").value = home.rooms ?? "";
  document.getElementById("contractFloor").value = "";
  document.getElementById("contractLand").value = "";
  document.getElementById("contractBalcony").value = "";
  document.getElementById("contractPrice").value =
    home.price ? formatContractPrice(home.price) : "";
  document.getElementById("contractPhone2").value = "";
  document.getElementById("contractOffer").value = "";
  document.getElementById("contractFee").value = "";
  document.getElementById("contractInfo").value =
    type === "sell"
      ? [home.type, home.finish, home.note].filter(Boolean).join(" | ")
      : "Talabga mos uy-joy izlash va topib berish.";

  renderContract();
}

function formatContractPrice(value){
  const n=Number(value);
  if(!Number.isFinite(n)) return value;
  if(n<0) return "$"+Math.round(Math.abs(n)).toLocaleString("en-US");
  if(n>=1e9) return (n/1e9).toFixed(2)+" mlrd so‘m";
  return Math.round(n/1e6)+" mln so‘m";
}

function closeContract(){
  document.getElementById("contractModal").classList.add("hidden");
}

function contractHeader(title){
  return `<div class="contract-preview">
  <h2>${title}</h2>
  <div style="text-align:center">_____ -СОНЛИ ШАРТНОМАСИ</div>
  <p>Урганч ш. ${contractEsc(cval("contractDate"))} йил</p>
  <p style="text-indent:25px">

function renderContract(){

 const sell=type==="sell";
 const title=sell ? "КЎЧМАС МУЛКНИ СОТИШ ХИЗМАТИ ТЎҒРИСИДА"
                  : "КЎЧМАС МУЛК ОЛИШ ХИЗМАТИ ТЎҒРИСИДА";
 let out=contractHeader(title);
 out+=`<p><b>1. ШАРТНОМА МАЗМУНИ</b></p>`;
 if(sell){
   out+=`<p style="text-indent:25px">1.1 «БУЮРТМАЧИ» ўзига тегишли бўлган мулкнинг тўлиқ маълумотларини «БАЖАРУВЧИ»га бериш, жумладан мулк бозорида харидорлар топиш ва сотиш хизматларини кўрсатиш ҳуқуқини «БАЖАРУВЧИ»га беради.</p>
   <p style="text-indent:25px">1.2. «БУЮРТМАЧИ» рўйхатда турувчи маълумотларини бериш ва сотишга розилик олишни таъминлайди. «БАЖАРУВЧИ» кўчмас мулкни кўрсатиш ва ҳужжатларни тайёрлашга ёрдам беради.</p>`;
 }else{
   out+=`<p style="text-indent:25px">1.1 «БУЮРТМАЧИ» талаб-таклифига асосан, уй-жойлар бозоридан хонадонлар излашга, топиб бериш хизматини кўрсатиш ҳуқуқини «БАЖАРУВЧИ»га беради.</p>
   <p style="text-indent:25px">1.2. «БАЖАРУВЧИ» талаб-таклифга мос келадиган уй-жойларни «БУЮРТМАЧИ»га таклиф қилади, кўчмас мулкни кўрсатиш ва ҳужжатларни тайёрлашга ёрдам беради.</p>`;
 }
 out+=`<p style="text-indent:25px">1.3. «БАЖАРУВЧИ» хизматларни кўрсатиш мажбуриятини олади, «БУЮРТМАЧИ» эса белгиланган муддатда тўловларни амалга оширади.</p>`;

}

function saveContractDraft(){

 alert("✅ Shartnoma ma'lumotlari saqlandi.");
}
